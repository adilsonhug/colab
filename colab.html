<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>COLAB Gestão</title>
<style>
/* Layout: app shell with left rail (desktop) / top tab strip (mobile); summary tiles above detail tables. */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --fg:#1b1a17; --muted:#6f6a60;
  --border:#e4e0d8; --accent:#e0242b; --accent-ink:#ffffff; --accent-soft:#fde4e4;
  --good:#1f9d63; --good-soft:#e2f3e9; --warn:#c07c00; --warn-soft:#f8eecf; --crit:#d64545; --crit-soft:#f8e2e2;
  --info:#2563eb; --info-soft:#e3ebfd;
  --shadow:0 1px 2px rgba(20,18,12,.05),0 6px 20px rgba(20,18,12,.06);
  --font-display:"Archivo","Archivo Black",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141310; --surface:#1e1c18; --surface-2:#272420; --fg:#f4f1ea; --muted:#a39c8f;
  --border:#332f29; --accent:#f0443f; --accent-ink:#ffffff; --accent-soft:#3a1a1a;
  --good:#35c17e; --good-soft:#17312366; --warn:#e0a93a; --warn-soft:#3a2f1266; --crit:#ef6b6b; --crit-soft:#3a1c1c66;
  --info:#6f9dff; --info-soft:#1b2a4a99;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141310; --surface:#1e1c18; --surface-2:#272420; --fg:#f4f1ea; --muted:#a39c8f;
  --border:#332f29; --accent:#f0443f; --accent-ink:#ffffff; --accent-soft:#3a1a1a;
  --good:#35c17e; --good-soft:#17312366; --warn:#e0a93a; --warn-soft:#3a2f1266; --crit:#ef6b6b; --crit-soft:#3a1c1c66;
  --info:#6f9dff; --info-soft:#1b2a4a99;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-left,0px));background:
  radial-gradient(1200px 600px at 80% -10%,var(--accent-soft),transparent 60%),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
  border-radius:20px;box-shadow:var(--shadow);padding:30px 26px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-1px}
.brand small{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:600}
.brand h1{font-size:20px}
.wordmark{background:#0b0b0b;color:#fff;border-radius:10px;padding:8px 10px 7px;display:flex;flex-direction:column;align-items:center;line-height:1;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
.wordmark span{font-family:"Arial Black","Archivo Black",var(--font-display);font-weight:900;font-size:15px;letter-spacing:.02em}
.wordmark span i{font-style:normal;color:#e0242b}
.wordmark small{font-family:Arial,sans-serif;font-size:6.5px!important;letter-spacing:.42em!important;margin-top:3px;padding-left:.42em;color:#fff!important;font-weight:400!important}
.wordmark.lg{padding:12px 14px 10px;border-radius:12px}
.wordmark.lg span{font-size:22px}.wordmark.lg small{font-size:8.5px!important}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field select,.field input,.inp{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--fg);font-size:14px;font-family:inherit}
.field select:focus,.field input:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.role-pills{display:flex;gap:7px;flex-wrap:wrap}
.role-pills button{flex:1;min-width:92px;border:1px solid var(--border);background:var(--bg);color:var(--fg);
  border-radius:10px;padding:9px;cursor:pointer;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.role-pills button.on{border-color:var(--accent);background:var(--accent-soft)}
.role-pills button span{font-size:10.5px;color:var(--muted);font-weight:500}
.hint{font-size:11.5px;color:var(--muted)}

/* ---------- SHELL ---------- */
#app{min-height:100%;display:grid;grid-template-columns:238px 1fr}
#rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;
  padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.rail-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.rail-brand .logo{width:38px;height:38px;font-size:16px;border-radius:10px}
.rail-brand h1{font-size:16px}.rail-brand small{font-size:9.5px}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;border:0;background:none;
  color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.nav-i:hover{background:var(--surface-2);color:var(--fg)}
.nav-i.on{background:var(--accent-soft);color:var(--fg)}
.nav-i.on svg{color:var(--accent)}
.nav-i svg{width:18px;height:18px;flex:none}
.rail-user{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.rail-user .meta{min-width:0}.rail-user .meta b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-user .meta span{font-size:11px;color:var(--muted)}

main{min-width:0;padding:0 0 60px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h2{font-size:19px;flex:1;min-width:140px}
/* espaço ao lado do título (ex.: totais do Estoque) */
#topExtra{flex:6;min-width:0}
#topExtra:empty{display:none}
.topbar:has(#topExtra:not(:empty)) h2{flex:none;min-width:0;margin-right:6px}
#topExtra .sumtiles.mini{margin:0;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
#topExtra .sumtiles.mini .tile{padding:5px 10px;gap:0}
#topExtra .sumtiles.mini .tile .val{font-size:14px;white-space:nowrap}
#topExtra .sumtiles.mini .tile .lbl{white-space:nowrap;overflow:hidden}
.demo-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);
  background:var(--warn-soft);padding:4px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.section{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-top:20px;max-width:1120px}
.daypick{display:flex;align-items:center;gap:8px;font-size:13px}
.daypick select{padding:7px 10px}

.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--fg);width:36px;height:36px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:17px;height:17px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:13px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.tile .lbl{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.tile .val{font-family:var(--font-display);font-weight:800;font-size:25px;letter-spacing:-.02em}
/* quadros compactos do Painel */
.tiles.compact{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tiles.compact .tile{padding:10px 13px;gap:3px;box-shadow:none}
.tiles.compact .tile .lbl{font-size:10.5px}
.tiles.compact .tile .val{font-size:19px}
.tiles.compact .tile .sub{font-size:11px}
.tiles.compact .chip{font-size:10.5px;padding:2px 7px}
.tile .sub{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.chip.good{color:var(--good);background:var(--good-soft)}.chip.info{color:var(--info);background:var(--info-soft)}
.badge.tam{color:var(--info);background:var(--info-soft)}.chip.warn{color:var(--warn);background:var(--warn-soft)}.chip.crit{color:var(--crit);background:var(--crit-soft)}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:15px;flex:1}
.card-b{padding:16px}
.card-b.pad0{padding:0}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}
thead th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;
  padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pay{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.badge{white-space:nowrap;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.badge.fis{background:var(--accent-soft);color:var(--accent)}
.badge.onl{background:#e4ecff;color:#3257c5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.onl{background:#1e2a4a;color:#8fb0ff}}
:root[data-theme="dark"] .badge.onl{background:#1e2a4a;color:#8fb0ff}
.stock-ok{color:var(--good);font-weight:700}.stock-low{color:var(--warn);font-weight:700}.stock-out{color:var(--crit);font-weight:700}
.lock{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
.lock svg{width:12px;height:12px}

/* chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding:6px 2px 0}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar{width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 0 0;transition:height .4s;position:relative}
.bar.zero{background:var(--border)}
.bar-wrap small{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* forms inline */
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.formrow .field label{text-transform:none;letter-spacing:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(10,8,4,.55);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:17px;display:flex;align-items:center;gap:9px}
.modal .row{display:flex;gap:9px;justify-content:flex-end}
.perm-ico{width:34px;height:34px;border-radius:9px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex:none}
.perm-ico svg{width:18px;height:18px}
.err{color:var(--crit);font-size:12px;font-weight:600;min-height:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:70;background:var(--fg);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* estoque / código de barras */
.scanbar{display:flex;gap:10px;align-items:center}
.scanbar .inp{font-size:16px;letter-spacing:.04em}
.busca{position:relative;flex:1;min-width:0}
.busca .inp{width:100%}
.sugest{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:320px;overflow:auto}
.sugest button{display:flex;width:100%;gap:10px;align-items:center;justify-content:space-between;text-align:left;border:0;border-bottom:1px solid var(--border);background:none;color:var(--fg);padding:9px 12px;font:inherit;font-size:13px;cursor:pointer}
.sugest button:last-child{border-bottom:0}
.sugest button.on,.sugest button:hover{background:var(--accent-soft)}
.sugest button:disabled{opacity:.5;cursor:not-allowed}
.sugest .vazio{padding:10px 12px;color:var(--muted);font-size:13px}
/* Nova venda: produto em 3 linhas — CATEGORIA › MARCA / descrição / cor + tamanho */
.pdv-prod{display:flex;flex-direction:column;gap:2px;min-width:0}
.pdv-cam{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.pdv-nm{font-weight:700;font-size:13.5px;line-height:1.25}
.pdv-var{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:2px}
/* desconto discreto na Nova venda */
.desc-link{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;text-decoration:underline;cursor:pointer;padding:0 0 10px;opacity:.7}
.desc-link:hover{opacity:1}
.desc-box{display:flex;gap:4px;padding-bottom:4px}
.desc-box .inp{width:58px;padding:5px 6px;font-size:12px}
/* cadastro em grade: quantidade de cada tamanho */
.grade-tam{margin-top:8px;padding:8px 10px;border:1px dashed var(--border);border-radius:10px;background:var(--surface-2)}
.grade-lin{display:flex;flex-wrap:wrap;gap:8px}
.grade-lin label{display:flex;align-items:center;gap:5px}
.grade-lin .inp{width:58px;padding:4px 6px}
.scan-ico{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.scan-ico svg{width:22px;height:22px}
tbody tr.hl{background:var(--accent-soft)}
tbody tr.hl:hover{background:var(--accent-soft)}
.infobox{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:11px 13px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.infobox.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.mk-calc{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:16px}
.chk{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px;cursor:pointer}
.inp.cnt{width:84px;padding:6px 8px;text-align:right;display:inline-block}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-weight:700}
.total-bar b{font-family:var(--font-display);font-size:20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.modal.wide{max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.field .req{color:var(--accent)}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;min-width:42px}
.sizes button.on{border-color:var(--accent);background:var(--accent-soft)}
/* gráficos de colunas */
.cc{display:flex;align-items:flex-end;gap:6px;height:calc(var(--h) + 22px);padding-top:4px}
.cc-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cc-bars{display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}
.cc-bar-w{flex:1;max-width:34px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.cc-bar{width:100%;border-radius:4px 4px 0 0;cursor:default;transition:filter .15s}
.cc-bar:hover{filter:brightness(1.12)}
.cc-v{font-size:9.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cc-col small{font-size:10.5px;color:var(--muted);white-space:nowrap}
#ctip{position:fixed;z-index:80;pointer-events:none;opacity:0;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;
  padding:5px 9px;border-radius:7px;white-space:nowrap;transition:opacity .1s;left:0;top:0}
.datebar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.datebar .field{min-width:110px}
.datebar .inp{padding:8px 10px}
/* filtros no cabeçalho das tabelas */
thead tr.fil th{padding:6px 8px 8px;background:var(--surface);text-transform:none;letter-spacing:0;font-weight:500}
thead tr.fil .inp{padding:5px 7px;font-size:12px;border-radius:7px;min-width:64px}
thead tr.fil select.inp{padding-right:4px}
thead tr.fil.top th{border-bottom:0;padding-top:10px;padding-bottom:2px}
/* tabela do Estoque compacta: cabe na tela sem rolar para o lado */
table.estq{min-width:0;font-size:12.5px}
table.estq th,table.estq td{padding-left:6px;padding-right:6px}
table.estq tbody td,table.estq tfoot td{padding-top:8px;padding-bottom:8px}
table.estq thead th{font-size:10.5px}
table.estq tr.fil .inp{width:100%;min-width:52px;max-width:150px;font-size:11.5px;padding:4px 5px}
table.estq tbody td:nth-child(2){min-width:140px;max-width:210px}
table.estq tbody td:nth-child(3){font-size:11px!important}
table.estq tr.fil .busca{position:relative}
table.estq tr.fil .busca svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
table.estq tr.fil .busca .inp{max-width:none;padding:7px 10px 7px 30px;font-size:13px}
table.estq td.num{white-space:nowrap}
/* variações do mesmo modelo ficam juntas: linha fina entre elas, linha mais forte entre modelos */
table.estq tbody td{border-bottom:0;border-top:1px solid var(--border)}
table.estq tbody tr:first-child td{border-top:0}
table.estq tbody tr.mod-cont td{border-top-color:color-mix(in srgb,var(--border) 45%,transparent);padding-top:5px;padding-bottom:5px}
table.estq tbody tr.mod-ini td{border-top:2px solid color-mix(in srgb,var(--muted) 35%,transparent)}
tfoot td{padding:11px 14px;border-top:2px solid var(--border);background:var(--surface-2)}
.sumtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.sumtiles .tile{padding:11px 14px;gap:3px}.sumtiles .tile .val{font-size:20px}
/* totais compactos (Estoque): tudo numa linha só */
.sumtiles.mini{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.sumtiles.mini .tile{padding:8px 12px;gap:2px;box-shadow:none}
.sumtiles.mini .tile .lbl{font-size:10px}
.sumtiles.mini .tile .val{font-size:15px}
.sumtiles.mini .tile .sub{font-size:10.5px}
/* modal compacto (cadastro de produto) — cabe em tela de notebook sem rolar */
.modal.compact{max-width:760px;padding:16px 20px;gap:10px}
.modal.compact h3{font-size:16px}
.modal.compact .field{gap:3px}
.modal.compact .field label{font-size:11.5px}
.modal.compact .inp{padding:7px 10px;font-size:13.5px}
.modal.compact .sizes{gap:5px;align-items:center}
.modal.compact .sizes button{padding:4px 8px;min-width:36px;font-size:12px;border-radius:7px}
.modal.compact .g{display:grid;gap:10px}
.modal.compact .g2{grid-template-columns:1fr 2fr}
.modal.compact .g3{grid-template-columns:1fr 1.3fr 1fr}
.modal.compact .g5{grid-template-columns:repeat(5,1fr)}
.modal.compact .g4{grid-template-columns:repeat(4,1fr)}
.modal.compact .mk-calc{margin-top:0}
.modal.compact .chk{margin-top:0}
@media (max-width:640px){.modal.compact .g2,.modal.compact .g3{grid-template-columns:1fr}.modal.compact .g5,.modal.compact .g4{grid-template-columns:1fr 1fr}}

@media (max-width:860px){

  #rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;gap:4px;

  .rail-brand{display:none}.rail-user{display:none}

// Categorias de vendas antigas: deduzidas das colunas de peças e da descrição
function inferirCats(v){
  const d=(v.desc||"").toLowerCase(), c=new Set();
  if(v.over||v.long||v.trad||/camis|básic|basic|over|long|tradicional/.test(d)) c.add("Camisetas");
  if(v.cargo||v.jogger||/cargo|jogger|jeans|calça/.test(d)) c.add("Calças");
  if(v.tenis||/t[eê]nis/.test(d)) c.add("Tênis");
  if(/short|bermuda/.test(d)) c.add("Shorts");
  if(/moletom|jaqueta|casaco|blusa/.test(d)) c.add("Moletons");
  if(/new era|bon[eé]|brinco|juju|meia|cinto|carteira|[oó]culos|mochila|pochete/.test(d)) c.add("Acessórios");
  if(/conjunto/.test(d)) c.add("Outros");
  return c.size?[...c]:["Outros"];
}

/* ---------------- HELPERS ---------------- */
const $=s=>document.querySelector(s);
const ADM=()=>SESSION&&SESSION.role==="admin";

const n0=n=>n.toLocaleString("pt-BR");
let SESSION=null, THEME=null;
const MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MESES_L=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
/* filtro de data: ano / mês / dia */
const novoDF=()=>({ano:"",mes:"",dia:""});
const dfAtivo=f=>!!(f.ano||f.mes||f.dia);
const dfMatch=(iso,f)=>!!iso&&(!f.ano||iso.slice(0,4)===f.ano)&&(!f.mes||iso.slice(5,7)===f.mes)&&(!f.dia||iso.slice(8,10)===f.dia);
function dfHTML(px,f,isos,semDia){
  const u=a=>[...new Set(a)].sort();
  const anos=u(isos.map(i=>i.slice(0,4))).reverse();
  const meses=u(isos.filter(i=>!f.ano||i.startsWith(f.ano)).map(i=>i.slice(5,7)));
  const dias=u(isos.filter(i=>(!f.ano||i.startsWith(f.ano))&&(!f.mes||i.slice(5,7)===f.mes)).map(i=>i.slice(8,10)));
  if(f.mes&&!meses.includes(f.mes))meses.push(f.mes); if(f.dia&&!dias.includes(f.dia))dias.push(f.dia);
  return `<div class="field"><label>Ano</label>${optSel(px+"_ano",anos,f.ano)}</div>
    <div class="field"><label>Mês</label>${optSel(px+"_mes",meses.map(m=>[m,MESES_L[+m-1]]),f.mes)}</div>
    ${semDia?"":`<div class="field"><label>Dia</label>${optSel(px+"_dia",dias.map(d=>[d,String(+d)]),f.dia)}</div>`}`;
}
function dfBind(px,getF,re){
  ["ano","mes","dia"].forEach(k=>$("#"+px+"_"+k)?.addEventListener("change",e=>{const f=getF(); f[k]=e.target.value;
    if(k==="ano"){f.mes="";f.dia="";} if(k==="mes")f.dia=""; re();}));

/* filtro de período (de / até) para históricos gravados como "dd/mm/aaaa, hh:mm" */
const brISO=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(s||""); return m?`${m[3]}-${m[2]}-${m[1]}`:String(s||"").slice(0,10);};
const pfMatch=(s,f)=>{const d=brISO(s); return (!f.de||d>=f.de)&&(!f.ate||d<=f.ate);};
const pfHTML=(px,f)=>`<div class="field"><label>De</label><input class="inp" type="date" id="${px}_de" value="${f.de}"></div>
  <div class="field"><label>Até</label><input class="inp" type="date" id="${px}_ate" value="${f.ate}"></div>`;
const pfTxt=(f,extra=[])=>[f.de&&`de ${fmtDate(f.de)}`,f.ate&&`até ${fmtDate(f.ate)}`,...extra].filter(Boolean).join(" · ");
const ICO_PRINT='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>';
/* faturamento por mês: histórico + mês corrente (DIARIO) */
function fatMensal(){ return {...HIST,[MES_ATUAL]:+DIARIO.reduce((a,b)=>a+b,0).toFixed(2)}; }
function somaFaturamento(iso,valor,tipo,frete){
  if(iso.slice(0,7)===MES_ATUAL){
    const d=+iso.slice(8,10)-1; DIARIO[d]=+((DIARIO[d]||0)+valor).toFixed(2);
    MES.faturamento=+(MES.faturamento+valor).toFixed(2); MES.fretes+=frete;
    if(tipo==="Online") MES.online=+(MES.online+valor).toFixed(2); else MES.lojaFisica=+(MES.lojaFisica+valor).toFixed(2);
  } else { const ym=iso.slice(0,7); HIST[ym]=+((HIST[ym]||0)+valor).toFixed(2); }
}
const kBRL=n=>n>=1000?"R$ "+(n/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":brl(n);
/* gráfico de colunas (1 ou mais séries) com rótulo e dica ao passar o mouse */
function colChart({cats,series,h=170,labels=true}){
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const multi=series.length>1;
  const cols=cats.map((c,ci)=>`<div class="cc-col">
      <div class="cc-bars">${series.map(s=>{const v=s.values[ci]||0, hh=v>0?Math.max(3,v/max*h):0;
        return `<div class="cc-bar-w">${labels&&!multi&&v>0?`<span class="cc-v">${kBRL(v)}</span>`:""}
          <div class="cc-bar ${v?"":"z"}" data-tip="${esc((s.tipLbl?s.tipLbl(ci):c)+(multi?" · "+s.name:"")+": "+brl(v))}" style="height:${v?hh:2}px;background:${v?s.color:"var(--border)"}"></div></div>`;}).join("")}</div>
      <small>${esc(c)}</small></div>`).join("");
  return `<div class="cc" style="--h:${h+20}px">${cols}</div>`+
    (multi?`<div class="legend" style="margin-top:8px">${series.map(s=>`<span><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`:"");
}
(function(){ // dica flutuante dos gráficos
  const t=document.createElement("div"); t.id="ctip"; document.body.appendChild(t);
  document.addEventListener("mouseover",e=>{const b=e.target.closest("[data-tip]"); if(!b){t.style.opacity=0;return;}
    t.textContent=b.dataset.tip; const r=b.getBoundingClientRect(); t.style.opacity=1;
    t.style.left=Math.min(innerWidth-t.offsetWidth-8,Math.max(8,r.left+r.width/2-t.offsetWidth/2))+"px"; t.style.top=(r.top-t.offsetHeight-8)+"px";});
})();

/* ---------------- LOGIN ---------------- */
let LOGIN_USERS=[], pickUser=null; // lista pública (só nome e cargo), vinda de lista_login()
function renderPills(){
  if(!LOGIN_USERS.length){ $("#userPills").innerHTML='<span class="hint">Carregando usuários…</span>'; return; }
  if(!LOGIN_USERS.some(u=>u.id===pickUser)) pickUser=LOGIN_USERS[0].id;
  $("#userPills").innerHTML=LOGIN_USERS.map(u=>`<button type="button" data-u="${esc(u.id)}" class="${u.id===pickUser?'on':''}">
    ${esc(u.name)}<span>${esc(u.desc||"")}</span></button>`).join("");
}
renderPills();
$("#userPills").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;pickUser=b.dataset.u;renderPills();$("#pw").focus();});
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!pickUser||!window.DB) return;
  const btn=$("#loginBtn"); btn.disabled=true; $("#pwHint").textContent="Entrando…";
  try{
    await DB.entrar(pickUser,$("#pw").value);
    SESSION=USERS.find(u=>u.id===pickUser);
    if(!SESSION) throw new Error("login_invalido");
    $("#pw").value=""; $("#pwHint").textContent=""; startApp();
  }catch(err){
    $("#pwHint").textContent=/login_invalido/.test(err.message)?"Usuário ou senha incorretos.":"Não foi possível entrar: "+err.message;
  }finally{ btn.disabled=false; }
});

function barChart(data){
  const max=Math.max(...data,1);
  return `<div class="bars">${data.map((v,i)=>{
    const h=v>0?Math.max(4,v/max*160):3;
    return `<div class="bar-wrap"><div class="bar ${v?'':'zero'}" style="height:${h}px" title="Dia ${i+1}: ${brl(v)}"></div>${(i+1)%2?`<small>${i+1}</small>`:'<small>&nbsp;</small>'}</div>`;
  }).join("")}</div><div class="legend"><span><span class="dot" style="background:var(--accent)"></span>Faturamento por dia</span><span>Pico: ${brl(max)} (dia ${data.indexOf(max)+1})</span></div>`;
}

      if(!d.ean) return err("Informe o código de barras.");

      if(ESTOQUE.some(x=>x!==p&&x.ean===d.ean)) return err("Esse código de barras já está em outro produto.");
    }
    if(!d.sku) return err("Informe o código do produto.");
    if(ESTOQUE.some(x=>x!==p&&x.sku===d.sku)) return err("Esse código já existe em outro produto.");
    if(!d.cor) return err("Informe a cor.");
    if(!d.tam) return err("Informe o tamanho.");
    if(isAdmin&&(isNaN(d.custo)||d.custo<0)) return err("Custo inválido.");
    if(isNaN(d.preco)||d.preco<=0) return err("Informe o preço de venda.");
    if(isNaN(d.qtd)||d.qtd<0) return err("A quantidade não pode ficar negativa.");
    if(isNaN(d.min)||d.min<0) return err("Estoque mínimo inválido.");
    const mudaPreco=Math.abs(d.preco-p.preco)>0.004, mudaQtd=d.qtd!==p.qtd;
    const mudaEan=!!p.ean&&d.ean!==String(p.ean); // código já cadastrado só muda com a senha do administrador
    const motivo=$("#e_mot").value, obs=$("#e_obs").value.trim(); // lidos antes: a tela de senha substitui este modal
    const gravar=()=>{
      if(d.sku!==p.sku){ // mantém histórico ligado ao produto
        const velho=p.sku;
        if(ESTQ_SEL.delete(velho)) ESTQ_SEL.add(d.sku);
        ENTRADAS.forEach(e=>{if(e.sku===velho)e.sku=d.sku;});
        AJUSTES.forEach(a=>{if(a.sku===velho)a.sku=d.sku;});
        VENDAS.forEach(v=>(v.itens||[]).forEach(it=>{if(it.sku===velho)it.sku=d.sku;}));
      }
      if(mudaQtd) AJUSTES.unshift({data:agoraStr(),sku:d.sku,nome:d.nome,motivo,obs,
        antes:p.qtd,depois:d.qtd,user:SESSION.name,autor:isAdmin?SESSION.name:"senha admin"});
      Object.assign(p,d);
      closeModal(); ESTQ_HL=i; viewEstoque();
      toast(`${p.nome} (${p.cor} · ${p.tam}) atualizado.`);
    };
    if(mudaPreco||mudaQtd||mudaEan){
      const o=[mudaPreco&&`preço ${brl(p.preco)} → ${brl(d.preco)}`, mudaQtd&&`quantidade ${p.qtd} → ${d.qtd}`,
        mudaEan&&`código de barras ${p.ean} → ${d.ean}`].filter(Boolean).join(" e ");
      askAdminPw(gravar,`Confirme a alteração de ${esc(p.nome)} (${o}) com a senha do administrador.`);
    } else gravar();
  });
}

/* ---------------- ETIQUETAS COM CÓDIGO DE BARRAS ---------------- */
// código interno da loja: EAN-13 começando com "200" (faixa reservada para uso interno) + sequência + dígito verificador
const eanDV=d12=>{let s=0; for(let i=0;i<12;i++) s+=(+d12[i])*(i%2?3:1); return String((10-s%10)%10);};
const eanValido=c=>/^\d{13}$/.test(c)&&eanDV(c.slice(0,12))===c[12];
function gerarEAN(){
  const usados=new Set(ESTOQUE.map(p=>String(p.ean||"")));
  let n=[...usados].filter(e=>/^200\d{10}$/.test(e)).reduce((m,e)=>Math.max(m,+e.slice(3,12)),0), c;
  do{ n++; const b="200"+String(n).padStart(9,"0"); c=b+eanDV(b); }while(usados.has(c));
  return c;
}
// [largura, altura, etiquetas por fileira, layout] em mm; a primeira é o padrão. layout "alta": adesiva em pé, sem furo
const ETQ_TAM={"35x65x3":[35,65,3],"40x25":[40,25,1],"50x30":[50,30,1],"33x22":[33,22,1],"30x40x2":[30,40,2,"alta"]};
const etqNome=t=>{const [w,h,c]=ETQ_TAM[t]; return `${w} × ${h} mm${c>1?` — ${c} por fileira`:""}`;};
const etqPref=()=>{ try{ return JSON.parse(localStorage.getItem("colab_etq")||"{}"); }catch(e){ return {}; } };
const etqSalvaPref=o=>{ try{ localStorage.setItem("colab_etq",JSON.stringify(o)); }catch(e){} };
let _barLib=null;
const carregaBarcode=()=>_barLib||(_barLib=new Promise((ok,erro)=>{
  if(window.JsBarcode) return ok(window.JsBarcode);
  const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js";
  s.onload=()=>ok(window.JsBarcode); s.onerror=()=>{_barLib=null;erro(new Error("jsbarcode"));};
  document.head.appendChild(s);
}));

async function imprimirEtiquetas(itens,tam,comPreco,gap=0,desl=0,vdesl=0){
  const JB=await carregaBarcode();

  const alta=LAY==="alta"; // adesiva em pé (ex.: 30 × 40): tudo empilhado e centralizado
  const vert=H>W&&!alta; // etiqueta em pé (ex.: 35 × 65): layout próprio
  const PW=C*W+(C-1)*gap;
  // desl: anda com o conteúdo dentro de cada etiqueta (+ direita, − esquerda) sem sair da área impressa
  // etiqueta em pé: conteúdo com no máximo 30 mm de largura, centralizado → margem de segurança se a impressão desalinhar
  const mrg=vert?Math.max(2,(W-30)/2):2;

async function excelEstoque(itens,isAdmin){
  if(!itens.length) return toast("Nada para exportar com esses filtros.");
  toast("Gerando planilha…");
  let X; try{ X=await carregaXlsx(); }catch(e){ return toast("Não foi possível gerar o Excel. Verifique a internet."); }
  const cab=["Produto","Código","Cód. barras","Cor","Tamanho","Categoria","Fornecedor","Marca",...(isAdmin?["Custo (R$)"]:[]),"Preço venda (R$)","Estoque","Estoque mín.","Situação",...(isAdmin?["Total custo (R$)"]:[]),"Total venda (R$)"];
  const linhas=itens.map(p=>[p.nome,p.sku,p.ean||"",p.cor||"",p.tam||"",p.cat||"",fornDe(p)||"",p.marca||"",...(isAdmin?[p.custo]:[]),p.preco,p.qtd,p.min??"",situacao(p),...(isAdmin?[p.qtd*p.custo]:[]),p.qtd*p.preco]);
  const tot=["TOTAL","","","","","","","",...(isAdmin?[""]:[]),"",itens.reduce((s,p)=>s+p.qtd,0),"","",...(isAdmin?[itens.reduce((s,p)=>s+p.qtd*p.custo,0)]:[]),itens.reduce((s,p)=>s+p.qtd*p.preco,0)];
  const ws=X.utils.aoa_to_sheet([cab,...linhas,[],tot]);
  // códigos de barras como texto (sem notação científica) e valores em R$
  const moeda=new Set(cab.map((c,i)=>c.includes("R$")?i:-1).filter(i=>i>=0));
  for(let r=1;r<=linhas.length+2;r++) cab.forEach((c,ci)=>{
    const cel=ws[X.utils.encode_cell({r,c:ci})]; if(!cel) return;
    if(ci===2&&cel.v!==""){cel.t="s";cel.v=String(cel.v);} // cód. barras
    if(moeda.has(ci)&&cel.t==="n") cel.z='"R$" #,##0.00';
  });
  ws["!cols"]=cab.map((c,i)=>({wch:i===0?32:Math.max(c.length+2,12)}));
  ws["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:linhas.length,c:cab.length-1}})};
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,"Estoque");
  const d=new Date(), dd=n=>String(n).padStart(2,"0");
  X.writeFile(wb,`estoque-colab-${d.getFullYear()}-${dd(d.getMonth()+1)}-${dd(d.getDate())}.xlsx`);
  toast(`Planilha baixada: ${itens.length} produto(s).`);
}

function twoCol(arr){
  let rows="";
  for(let i=0;i<16;i++){
    const a=i,b=i+16;
    rows+=`<tr><td class="tnum">${a+1}/10</td><td class="num tnum">${brl(arr[a]||0)}</td>`
      +(b<31?`<td class="tnum">${b+1}/10</td><td class="num tnum">${brl(arr[b]||0)}</td>`:`<td></td><td></td>`)+`</tr>`;

}

// formulários de produto: Enter pula para o próximo campo; no último, vai para o botão de salvar
function enterProximoCampo(e){
  const t=e.target;
  if(e.key!=="Enter"||e.defaultPrevented||e.shiftKey||!/^(INPUT|SELECT)$/.test(t.tagName)||/^(checkbox|radio|button|submit)$/.test(t.type)) return;
  e.preventDefault();
  const campos=[...e.currentTarget.querySelectorAll("input,select")].filter(x=>
    !x.disabled&&!x.readOnly&&x.offsetParent!==null&&!/^(checkbox|radio|hidden|button|submit)$/.test(x.type));
  const prox=campos[campos.indexOf(t)+1];
  if(prox){prox.focus(); prox.select?.();}
  else e.currentTarget.querySelector(".row .btn:not(.ghost)")?.focus();
}

const COD_GENERICO="123456";

/* ---------------- PIX (QR Code estático, padrão BR Code do Banco Central) ----------------
   >>> DADOS DA LOJA — iguais aos cadastrados no banco <<<
   chave: CNPJ/CPF só números, e-mail, telefone no formato +5549999999999 ou chave aleatória */
const PIX_LOJA={chave:"+5549988195396", nome:"Zero 1", cidade:"Chapeco"};
const pixTxt=(s,max)=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 .\-]/g,"").toUpperCase().trim().slice(0,max);
const pixCampo=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function pixCRC(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021):(c<<1); c&=0xFFFF; } return c.toString(16).toUpperCase().padStart(4,"0"); }
// monta o "copia e cola" com o valor da venda; txid identifica a venda no extrato
function pixPayload(valor,txid){
  let chave=String(PIX_LOJA.chave||"").trim();
  if(/^[\d.\-\/]+$/.test(chave)) chave=chave.replace(/\D/g,""); // CNPJ/CPF digitado com pontuação
  const conta=pixCampo("00","br.gov.bcb.pix")+pixCampo("01",chave);
  const tx=(String(txid||"").replace(/[^A-Za-z0-9]/g,"").slice(0,25))||"***";
  let p=pixCampo("00","01")+pixCampo("26",conta)+pixCampo("52","0000")+pixCampo("53","986")
    +pixCampo("54",(+valor).toFixed(2))+pixCampo("58","BR")+pixCampo("59",pixTxt(PIX_LOJA.nome,25)||"LOJA")
    +pixCampo("60",pixTxt(PIX_LOJA.cidade,15)||"BRASIL")+pixCampo("62",pixCampo("05",tx))+"6304";
  return p+pixCRC(p);
}
let _qrLib=null;
const carregaQR=()=>_qrLib||(_qrLib=new Promise((ok,erro)=>{
  if(window.qrcode) return ok(window.qrcode);
  const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
  s.onload=()=>ok(window.qrcode); s.onerror=()=>{_qrLib=null;erro(new Error("qrcode"));};
  document.head.appendChild(s);
}));
// mostra o QR do Pix; onPago é chamado só quando o vendedor confirma que o Pix caiu
async function modalPix(valor,txid,onPago){
  if(!String(PIX_LOJA.chave||"").trim()){
    modal(`<h3>Pix não configurado</h3><p style="margin:0;font-size:13px;color:var(--muted)">A chave Pix da loja ainda não foi cadastrada no sistema. Peça ao administrador para configurar.</p>

    $("#px_semqr").addEventListener("click",()=>{closeModal();onPago();}); return;
  }
  const code=pixPayload(valor,txid);
  modal(`<h3>Pagamento via Pix</h3>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="font-size:13px;color:var(--muted)">Valor</div>
      <div style="font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1">${brl(valor)}</div>
      <div id="px_qr" style="width:240px;height:240px;background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;border:1px solid var(--border)"><span class="hint">Gerando QR Code…</span></div>
      <div class="hint" style="text-align:center">${esc(pixTxt(PIX_LOJA.nome,25))} · ${esc(PIX_LOJA.chave)}</div>
      <div style="display:flex;gap:6px;width:100%"><input class="inp" id="px_code" readonly value="${esc(code)}" style="font-size:11px;flex:1">
        <button class="btn ghost sm" id="px_copy" type="button">Copiar</button></div>
      <div class="infobox" style="font-size:12.5px;width:100%;box-sizing:border-box;display:block;text-align:center">Confira no app do banco se o Pix de <b>${brl(valor)}</b> caiu antes de finalizar.</div>
    </div>
    <div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="px_ok">✓ Pix recebido — finalizar venda</button></div>`);
  $("#px_copy").addEventListener("click",async()=>{ const x=$("#px_code"); x.select();
    try{ await navigator.clipboard.writeText(code); }catch(e){ document.execCommand("copy"); } toast("Código Pix copiado."); });
  $("#px_ok").addEventListener("click",()=>{closeModal();onPago();});
  try{
    const qr=(await carregaQR())(0,"M"); qr.addData(code); qr.make();
    if($("#px_qr")) $("#px_qr").innerHTML=qr.createSvgTag({cellSize:5,margin:2,scalable:true}).replace("<svg ",'<svg style="width:100%;height:100%" ');
  }catch(e){ if($("#px_qr")) $("#px_qr").innerHTML='<span class="hint" style="text-align:center">Sem internet para desenhar o QR. Use o “Copiar” e envie o código ao cliente.</span>'; }
}

  // desconto: digitando % calcula R$ (e acompanha o carrinho); digitando R$ calcula %
  let descModo="brl";
  const pct=()=>Math.min(100,Math.max(0,parseNum($("#v_pct").value)||0));
  const desc=()=>descModo==="pct"?+(sub()*pct()/100).toFixed(2):Math.min(sub(),parseNum($("#v_desc").value)||0);
  const frete=()=>parseNum($("#v_frete").value)||0;
  const syncDesc=()=>{ const s0=sub();
    if(descModo==="pct"){ $("#v_desc").value=pct()?desc().toFixed(2).replace(".",","):""; }
    else { const d=desc(); $("#v_pct").value=d&&s0?(d/s0*100).toLocaleString("pt-BR",{maximumFractionDigits:1}):""; } };
  const total=()=>Math.max(0,sub()-desc()+frete());
  // produto na venda: CATEGORIA › MARCA / descrição / cor + tamanho
  const caminho=p=>[p.cat,p.marca].filter(Boolean).map(x=>esc(String(x).toUpperCase())).join(` <span style="opacity:.6">›</span> `);
  const infoProd=(p,extra="")=>`<div class="pdv-prod">
      ${caminho(p)?`<div class="pdv-cam">${caminho(p)}</div>`:""}
      <div class="pdv-nm">${esc(p.nome)}</div>
      <div class="pdv-var">${p.cor&&p.cor!=="—"?`<span class="badge">${esc(corCurta(p))}</span>`:""}${p.tam?`<span class="badge tam">Tam. ${esc(p.tam)}</span>`:""}${extra}</div></div>`;
  const draw=()=>{
    $("#v_cart").innerHTML=cart.length?`<div class="tw" style="border:1px solid var(--border);border-radius:10px"><table style="min-width:0">
      <thead><tr><th>Produto</th><th class="num">Qtd.</th><th class="num">Unit.</th><th class="num">Subtotal</th><th></th></tr></thead>
      <tbody>${cart.map((i,k)=>{const g=ehGenerico(i.p), rever=g&&i.preco<=1;
        return `<tr${rever?' style="background:var(--warn-soft)"':""}><td>${infoProd(i.p,g?`<span class="chip warn" style="font-size:10.5px">item genérico · informe o preço</span>`:`<span class="hint">${i.p.qtd} em estoque</span>`)}</td>
        <td class="num"><input class="inp cnt" type="number" min="1" data-q="${k}" value="${i.qtd}" style="width:64px"></td>
        <td class="num tnum">${g?`<input class="inp" data-pr="${k}" inputmode="decimal" value="${i.preco.toFixed(2).replace(".",",")}" title="Preço deste item genérico" style="width:86px;text-align:right;${rever?"border-color:var(--warn);":""}">`:brl(i.preco)}</td><td class="num tnum">${brl(i.qtd*i.preco)}</td>
        <td><button class="icon-btn" style="width:28px;height:28px" data-rm="${k}" title="Remover">×</button></td></tr>`;}).join("")}</tbody></table></div>`
      :`<div class="infobox" style="text-align:center;color:var(--muted);padding:28px">Nenhum produto ainda. Bipe o primeiro item.</div>`;
    $("#v_cart").querySelectorAll("[data-q]").forEach(x=>x.addEventListener("change",()=>{
      const i=cart[+x.dataset.q], q=Math.max(1,parseInt(x.value)||1);
      if(q>i.p.qtd&&!ehGenerico(i.p)){msg(`Só há ${i.p.qtd} un. de ${i.p.nome} em estoque.`);i.qtd=i.p.qtd;} else i.qtd=q; draw();}));
    // preço editável só no item genérico
    $("#v_cart").querySelectorAll("[data-pr]").forEach(x=>{
      x.addEventListener("focus",()=>x.select());
      x.addEventListener("change",()=>{const v=parseNum(x.value); cart[+x.dataset.pr].preco=v>0?+v.toFixed(2):1; draw();});
      x.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();x.blur();}});
    });
    $("#v_cart").querySelectorAll("[data-rm]").forEach(x=>x.addEventListener("click",()=>{cart.splice(+x.dataset.rm,1);draw();}));
    $("#v_sub").textContent=brl(sub());
    syncDesc();
    const pc=sub()?desc()/sub()*100:0;
    $("#v_adj").textContent=(desc()||frete())?`−${brl(desc())}${desc()?` (${pc.toLocaleString("pt-BR",{maximumFractionDigits:1})}%)`:""} / +${brl(frete())}`:"—";
    $("#v_total").textContent=brl(total());
    document.querySelector(".card-h .hint").textContent=`${cart.reduce((s,i)=>s+i.qtd,0)} peça(s)`;
  };
  const poe=p=>{
    $("#v_code").value=""; fechaSug();
    const it=cart.find(i=>i.p===p), ja=it?it.qtd:0;
    if(ja+1>p.qtd&&!ehGenerico(p)) return msg(`Sem estoque de ${p.nome} (${p.cor} · ${p.tam}): ${p.qtd} un. disponíveis.`);
    if(it) it.qtd++; else cart.push({p,qtd:1,preco:p.preco});
    if(ehGenerico(p)&&!it){ msg("Item genérico: digite o preço certo na coluna Unit.",false); draw();
      setTimeout(()=>{const x=$(`#v_cart [data-pr="${cart.length-1}"]`); x?.focus(); x?.select();},30); return; }
    msg(`✓ ${[p.cat,p.marca].filter(Boolean).join(" › ")}${p.cat||p.marca?" · ":""}${p.nome} · ${corCurta(p)} · Tam. ${p.tam}`,true); draw();
  };
  // busca por descrição: todas as palavras digitadas precisam aparecer (nome, código, cor, tamanho, categoria)
  let sug=[], sel=0;
  const fechaSug=()=>{sug=[];$("#v_sug").hidden=true;};
  const desenhaSug=()=>{
    const box=$("#v_sug");
    box.innerHTML=sug.length?sug.map((p,k)=>`<button type="button" data-s="${k}" class="${k===sel?"on":""}" ${p.qtd>0||ehGenerico(p)?"":"disabled"}>
        <span>${infoProd(p,`<span class="hint">${esc(p.sku)}</span>`)}</span>
        <span style="text-align:right;white-space:nowrap"><b class="tnum">${brl(p.preco)}</b><div class="hint">${p.qtd>0?`${p.qtd} em estoque`:"esgotado"}</div></span></button>`).join("")
      :`<div class="vazio">Nenhum produto com “${esc($("#v_code").value.trim())}”.</div>`;
    box.hidden=false;
    box.querySelector("button.on")?.scrollIntoView({block:"nearest"});
  };
  const buscaSug=()=>{
    const t=$("#v_code").value.trim();
    if(t.length<2||/^\d+$/.test(t)) return fechaSug(); // só números = código de barras
    const ps=semAcento(t).split(/\s+/);
    sug=ESTOQUE.filter(p=>{const txt=semAcento([p.nome,p.marca,p.sku,p.cor,p.tam,p.cat].join(" ")); return ps.every(x=>txt.includes(x));})
      .sort((a,b)=>(b.qtd>0)-(a.qtd>0)||a.nome.localeCompare(b.nome,"pt-BR")).slice(0,12);
    sel=Math.max(0,sug.findIndex(p=>p.qtd>0)); desenhaSug();
  };
  const add=()=>{
    const c=$("#v_code").value.trim(); if(!c)return;
    const p=acharProduto(c); if(p) return poe(p);           // código de barras / código exato
    if(sug[sel]&&(sug[sel].qtd>0||ehGenerico(sug[sel]))) return poe(sug[sel]); // item escolhido na lista
    if(!/^\d+$/.test(c)&&!$("#v_sug").hidden) return;       // lista aberta sem item disponível
    $("#v_code").value=""; fechaSug(); msg(`Código ${c} não cadastrado.`);
  };
  $("#v_code").addEventListener("input",buscaSug);
  $("#v_code").addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();add();}
    else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&sug.length){
      e.preventDefault(); const d=e.key==="ArrowDown"?1:-1;
      for(let k=1;k<=sug.length;k++){const n=(sel+d*k+sug.length*k)%sug.length; if(sug[n].qtd>0){sel=n;break;}}
      desenhaSug();
    } else if(e.key==="Escape") fechaSug();
  });
  $("#v_sug").addEventListener("mousedown",e=>{const b=e.target.closest("button[data-s]"); if(!b||b.disabled)return; e.preventDefault(); poe(sug[+b.dataset.s]); $("#v_code").focus();});
  $("#v_code").addEventListener("blur",()=>setTimeout(fechaSug,150));
  $("#v_add").addEventListener("click",add);
  $("#v_descbtn").addEventListener("click",()=>{$("#v_descbtn").hidden=true;$("#v_descbox").hidden=false;$("#v_pct").focus();});
  $("#v_pct").addEventListener("input",()=>{descModo="pct";draw();});
  $("#v_desc").addEventListener("input",()=>{descModo="brl";draw();});
  $("#v_frete").addEventListener("input",draw);
  $("#v_clear").addEventListener("click",()=>{PDV.cart=[];PDV.ultima=null;viewPDV();});
  $("#v_ver")?.addEventListener("click",()=>{current="vendas";renderNav();route();});
  if(PDV.pref&&PDV.pref.pay) $("#v_pay").value=PDV.pref.pay; // veio do retorno de funcionário: já em desconto em folha
  draw(); setTimeout(()=>$("#v_code")?.focus(),50);

  $("#v_save").addEventListener("click",()=>{
    if(!cart.length) return msg("Bipe pelo menos um produto.");
    const falta=cart.find(i=>i.qtd>i.p.qtd&&!ehGenerico(i.p)); if(falta) return msg(`Estoque insuficiente de ${falta.p.nome}.`);
    // item genérico com R$ 1,00: não existe nada na loja nesse valor → provavelmente esqueceu de pôr o preço
    const kRev=cart.findIndex(i=>ehGenerico(i.p)&&i.preco<=1);
    if(kRev>=0){
      modal(`<h3 style="color:var(--warn)">⚠ Rever item</h3>
        <p style="margin:0;font-size:14px">O item genérico <b>${esc(cart[kRev].p.nome)}</b> está com <b>${brl(cart[kRev].preco)}</b>.</p>
        <p style="margin:0;font-size:13px;color:var(--muted)">Nenhum produto da loja custa esse valor. Digite o preço certo do item antes de finalizar a venda.</p>
        <div class="row"><button class="btn" id="rev_ok">Corrigir o preço</button></div>`);
      $("#rev_ok").addEventListener("click",()=>{closeModal(); const x=$(`#v_cart [data-pr="${kRev}"]`); x?.focus(); x?.select();});
      setTimeout(()=>$("#rev_ok")?.focus(),30);
      return;
    }
    const dataISO=$("#v_data").value; if(!dataISO) return msg("Informe a data da venda.");
    // vendedor e tipo obrigatórios: começam em branco para ninguém esquecer de escolher
    const exige=(id,texto)=>{ const t=$("#"+id); if(t.value) return false;
      t.style.borderColor="var(--crit)"; t.focus(); t.addEventListener("change",()=>{t.style.borderColor="";},{once:true}); msg(texto); return true; };
    if(exige("v_vend","Escolha o vendedor da venda.")) return;
    if(exige("v_tipo","Escolha o tipo da venda: Loja física ou Online.")) return;
    const valor=+total().toFixed(2), tipo=$("#v_tipo").value, fr=frete();
    const pay=$("#v_pay").value, vend=$("#v_vend").value, pecas=cart.reduce((s,i)=>s+i.qtd,0), dsc=desc();
    // confirmação final antes de registrar (resumo da venda)
    modal(`<h3>Confirmar venda?</h3>
      <div class="tw" style="border:1px solid var(--border);border-radius:10px;max-height:34vh;overflow:auto"><table style="min-width:0">
        <tbody>${cart.map(i=>`<tr><td><b>${esc(i.p.nome)}</b><div class="hint">${esc(corCurta(i.p))} · Tam. ${esc(i.p.tam||"—")}</div></td>
          <td class="num tnum" style="white-space:nowrap">${i.qtd} × ${brl(i.preco)}</td><td class="num tnum" style="white-space:nowrap"><b>${brl(i.qtd*i.preco)}</b></td></tr>`).join("")}</tbody></table></div>
      <div class="infobox" style="gap:4px">
        <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Pagamento</span><b>${esc(pay)}</b></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Vendedor</span><b>${esc(vend)}</b></div>
        ${dsc||fr?`<div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Ajustes</span><b class="tnum">${dsc?"−"+brl(dsc):""}${dsc&&fr?" / ":""}${fr?"+"+brl(fr):""}</b></div>`:""}
      </div>
      <div class="total-bar"><span>Total · ${pecas} peça(s)</span><b class="tnum">${brl(valor)}</b></div>
      ${pay===PAG_FOLHA?`<div class="field"><label>Funcionário (desconto em folha) <span class="req">*</span></label><select class="inp" id="cf_func"><option value="">Selecione…</option>${USERS.filter(u=>u.ativo!==false).map(u=>`<option ${PDV.pref&&PDV.pref.func===u.name?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div>`:""}
      <div class="err" id="cf_err" style="min-height:0"></div>
      <div class="row"><button class="btn ghost" data-close>Voltar</button><button class="btn" id="cf_ok">${pay==="Pix"?"Confirmar e gerar Pix":pay===PAG_FOLHA?"🔒 Confirmar (senha do administrador)":"Confirmar venda"}</button></div>`,"wide");
    setTimeout(()=>$("#cf_ok")?.focus(),30);
    $("#cf_ok").addEventListener("click",()=>{
      // venda para funcionário: escolhe quem e sempre pede a senha do administrador
      if(pay===PAG_FOLHA){
        const func=$("#cf_func").value; if(!func) return $("#cf_err").textContent="Escolha o funcionário que vai ter o desconto em folha.";
        return askAdminPw(()=>registrarVenda(dataISO,valor,tipo,fr,func),`Venda de ${brl(valor)} para ${esc(func)} com desconto em folha. Confirme com a senha do administrador.`);
      }
      closeModal();
      // Pix: mostra o QR Code com o valor; a venda só é registrada depois de confirmar que o Pix caiu
      if(pay==="Pix"&&valor>0){
        const txid="COLAB"+Date.now().toString(36).toUpperCase();
        return modalPix(valor,txid,()=>registrarVenda(dataISO,valor,tipo,fr));
      }
      registrarVenda(dataISO,valor,tipo,fr);
    });
  });
  function registrarVenda(dataISO,valor,tipo,fr,func){
    cart.forEach(i=>i.p.qtd-=i.qtd);
    const descr=cart.map(i=>`${i.qtd>1?i.qtd+" ":""}${i.p.nome} ${i.p.cor} ${i.p.tam}`).join(" + ")+(func?` — funcionário: ${func} (desconto em folha)`:"");
    const hora=dataISO===hojeISO()?new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
    const v={id:VENDAS.length+1,desc:descr,valor,desconto:desc(),vend:$("#v_vend").value,pay:$("#v_pay").value,tipo,nova:true,dataISO,hora,
      itens:cart.map(i=>({sku:i.p.sku,qtd:i.qtd,preco:i.preco,cat:i.p.cat})),cats:[...new Set(cart.map(i=>i.p.cat))],...(func?{func}:{})};
    VENDAS.push(v); somaFaturamento(dataISO,valor,tipo,fr);
    PDV={cart:[],ultima:v}; viewPDV(); toast(`Venda de ${brl(valor)} registrada. Estoque baixado.`);
  }
}

/* ---------------- DESCONTO EM FOLHA (vendas para funcionários) ----------------
   A venda é feita na hora, pela Nova venda (pagamento "Desconto em folha" + senha do administrador).
   Aqui o administrador vê, no dia do pagamento, quanto descontar de cada funcionário e marca como descontado. */
let FOF={sit:"pendente",mes:"",func:""};
function viewFolha(){
  if(SESSION.role!=="admin"){ current="dash"; return route(); }
  const todas=VENDAS.filter(v=>v.pay===PAG_FOLHA);
  const funcDe=v=>v.func||"Não informado";
  const meses=[...new Set(todas.map(v=>String(v.dataISO||"").slice(0,7)).filter(Boolean))].sort().reverse();
  const funcs=[...new Set(todas.map(funcDe))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const lista=todas.filter(v=>(FOF.sit==="todas"||(FOF.sit==="pendente"?!v.descontado:!!v.descontado))
    &&(!FOF.mes||String(v.dataISO||"").startsWith(FOF.mes))&&(!FOF.func||funcDe(v)===FOF.func))
    .sort((a,b)=>funcDe(a).localeCompare(funcDe(b),"pt-BR")||String(a.dataISO).localeCompare(String(b.dataISO)));
  const grupos={}; lista.forEach(v=>{(grupos[funcDe(v)]=grupos[funcDe(v)]||[]).push(v);});
  const pend=todas.filter(v=>!v.descontado), totPend=pend.reduce((s,v)=>s+v.valor,0);
  const mesLbl=ym=>`${MESES_L[+ym.slice(5,7)-1]}/${ym.slice(0,4)}`;
  $("#view").innerHTML=`
  <div class="section">
    <div class="tiles compact" style="margin-bottom:14px">
      <div class="tile"><div class="lbl"><span class="dot" style="background:#7a4cc2"></span>A descontar (total)</div><div class="val tnum">${brl(totPend)}</div><div class="sub">${pend.length} venda(s) · ${new Set(pend.map(funcDe)).size} funcionário(s)</div></div>
      <div class="tile"><div class="lbl"><span class="dot" style="background:var(--good)"></span>Já descontado</div><div class="val tnum">${brl(todas.filter(v=>v.descontado).reduce((s,v)=>s+v.valor,0))}</div><div class="sub">${todas.filter(v=>v.descontado).length} venda(s)</div></div>
    </div>
    <div class="toolbar" style="align-items:flex-end;flex-wrap:wrap">
      <div class="sizes" id="fo_sit">${[["pendente","A descontar"],["descontado","Descontadas"],["todas","Todas"]].map(([k,l])=>`<button type="button" data-s="${k}" class="${FOF.sit===k?"on":""}">${l}</button>`).join("")}</div>
      <div class="field" style="min-width:140px"><label>Mês da compra</label>${optSel("fo_mes",meses.map(m=>[m,mesLbl(m)]),FOF.mes,"Todos")}</div>
      <div class="field" style="min-width:150px"><label>Funcionário</label>${optSel("fo_func",funcs,FOF.func,"Todos")}</div>
      <button class="btn ghost" id="fo_print" style="margin-left:auto">${ICO_PRINT}Imprimir</button>
    </div>
    ${Object.keys(grupos).length?Object.entries(grupos).map(([f,vs])=>{
      const tot=vs.reduce((s,v)=>s+v.valor,0), pendF=vs.filter(v=>!v.descontado);
      return `<div class="card" style="margin-bottom:14px">
        <div class="card-h"><h3>${esc(f)}</h3><span class="chip" style="color:#7a4cc2;background:#7a4cc222">${brl(tot)}</span>
          <span class="hint">${vs.length} compra(s)</span>
          ${pendF.length?`<button class="btn sm" style="margin-left:auto" data-desc="${esc(f)}">✓ Marcar como descontado (${brl(pendF.reduce((s,v)=>s+v.valor,0))})</button>`:""}</div>
        <div class="card-b pad0"><div class="tw"><table style="min-width:0">
          <thead><tr><th>Data</th><th>Peças</th><th>Lançada por</th><th class="num">Valor</th><th>Situação</th></tr></thead>
          <tbody>${vs.map(v=>`<tr><td class="tnum">${v.dataISO?fmtDate(v.dataISO):"—"}${v.hora?`<div class="hint">${esc(v.hora)}</div>`:""}</td>
            <td>${esc(String(v.desc||"").replace(/ — funcionário: .*$/,""))}</td><td>${esc(v.vend||"—")}</td>
            <td class="num tnum"><b>${brl(v.valor)}</b></td>
            <td>${v.descontado?`<span class="chip good">Descontado</span><div class="hint">${esc(v.descontado)}</div>`:`<span class="chip warn">A descontar</span>`}</td></tr>`).join("")}</tbody>
        </table></div></div></div>`;}).join("")
    :`<div class="card"><div class="card-b"><div class="infobox" style="text-align:center;color:var(--muted)">${todas.length?"Nenhuma venda com esses filtros.":"Nenhuma venda para funcionário ainda. Elas são feitas na Nova venda com o pagamento “Desconto em folha”."}</div></div></div>`}
  </div>`;
  $("#fo_sit").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;FOF.sit=b.dataset.s;viewFolha();});
  $("#fo_mes").addEventListener("change",e=>{FOF.mes=e.target.value;viewFolha();});
  $("#fo_func").addEventListener("change",e=>{FOF.func=e.target.value;viewFolha();});
  $("#view").querySelectorAll("[data-desc]").forEach(b=>b.addEventListener("click",()=>{
    const f=b.dataset.desc, alvo=lista.filter(v=>funcDe(v)===f&&!v.descontado), tot=alvo.reduce((s,v)=>s+v.valor,0);
    askAdminPw(()=>{ const q=`${agoraStr()} · ${SESSION.name}`; alvo.forEach(v=>{v.descontado=q;}); viewFolha();
      toast(`${f}: ${brl(tot)} marcado como descontado.`); },
      `Marcar ${alvo.length} compra(s) de ${esc(f)} (${brl(tot)}) como descontadas do salário. Confirme com a senha do administrador.`);
  }));
  $("#fo_print").addEventListener("click",()=>{
    if(!lista.length) return toast("Nada para imprimir com esses filtros.");
    const filtros=[FOF.sit==="pendente"?"a descontar":FOF.sit==="descontado"?"descontadas":"todas",FOF.mes&&mesLbl(FOF.mes),FOF.func].filter(Boolean).join(" · ");
    imprimirRelatorio("Desconto em folha — vendas para funcionários",`
      <div class="meta">Emitido em ${agoraStr()} por ${esc(SESSION.name)} · ${esc(filtros)}</div>
      ${Object.entries(grupos).map(([f,vs])=>`<h3 style="margin:14px 0 4px;font-size:13px">${esc(f)} — ${brl(vs.reduce((s,v)=>s+v.valor,0))}</h3>
        <table><thead><tr><th>Data</th><th>Peças</th><th class="n">Valor</th><th>Situação</th></tr></thead>
        <tbody>${vs.map(v=>`<tr><td>${v.dataISO?fmtDate(v.dataISO):"—"}</td><td>${esc(String(v.desc||"").replace(/ — funcionário: .*$/,""))}</td><td class="n">${brl(v.valor)}</td><td>${v.descontado?"Descontado":"A descontar"}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="2">Total ${esc(f)}</td><td class="n">${brl(vs.reduce((s,v)=>s+v.valor,0))}</td><td></td></tr></tfoot></table>
        <div class="ass"><div>${esc(f)}</div><div>Administrador</div></div>`).join("")}`,"portrait");
  });
}

/* ---------------- CONDICIONAL / COSTUREIRA ---------------- */
let SAIF="abertas";
const saiResto=it=>it.qtd-(it.ret||0)-(it.vend||0);           // peças desse item que ainda estão fora
const saiAberta=s=>s.itens.some(it=>saiResto(it)>0);
const saiAtrasada=s=>saiAberta(s)&&s.prev&&s.prev<hojeISO();
const diasEntre=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
function viewSaidas(){
  const abertas=SAIDAS.filter(saiAberta);
  const fora=t=>abertas.filter(s=>!t||s.tipo===t).reduce((n,s)=>n+s.itens.reduce((m,it)=>m+saiResto(it),0),0);
  const lista=(SAIF==="abertas"?abertas:SAIDAS).slice().sort((a,b)=>saiAberta(b)-saiAberta(a)||String(b.data).localeCompare(String(a.data))||b.id-a.id);
  const hoje=hojeISO();
  $("#view").innerHTML=`
  <div class="section">
    <div class="tiles compact" style="margin-bottom:14px">
      <div class="tile"><div class="lbl">Peças fora da loja</div><div class="val tnum">${fora()}</div></div>
      <div class="tile"><div class="lbl"><span class="dot" style="background:#3257c5"></span>Em condicional</div><div class="val tnum">${fora("Condicional")}</div><div class="sub">${abertas.filter(s=>s.tipo==="Condicional").length} cliente(s)</div></div>
      <div class="tile"><div class="lbl"><span class="dot" style="background:var(--warn)"></span>Na costureira</div><div class="val tnum">${fora("Costureira")}</div><div class="sub">${abertas.filter(s=>s.tipo==="Costureira").length} saída(s)</div></div>      <div class="tile"><div class="lbl"><span class="dot" style="background:var(--crit)"></span>Atrasadas</div><div class="val tnum" style="${abertas.some(saiAtrasada)?"color:var(--crit)":""}">${abertas.filter(saiAtrasada).length}</div><div class="sub">passaram da previsão</div></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="sai_nova">+ Nova saída</button>
      <div class="sizes" id="sai_f"><button type="button" data-f="abertas" class="${SAIF==="abertas"?"on":""}">Em aberto</button><button type="button" data-f="todas" class="${SAIF==="todas"?"on":""}">Todas</button></div>
    </div>
    <div class="card"><div class="card-b pad0"><div class="tw"><table>
      <thead><tr><th>Tipo</th><th>Para quem</th><th>Saída</th><th>Previsão</th><th>Peças</th><th>Situação</th><th></th></tr></thead>
      <tbody>${lista.length?lista.map(s=>{
        const ab=saiAberta(s), atr=saiAtrasada(s), resto=s.itens.reduce((n,it)=>n+saiResto(it),0), tot=s.itens.reduce((n,it)=>n+it.qtd,0);
        const vend=s.itens.reduce((n,it)=>n+(it.vend||0),0);
        return `<tr${atr?' style="background:var(--crit-soft)"':""}>
          <td>${s.tipo==="Funcionário"?`<span class="chip" style="color:#7a4cc2;background:#7a4cc222">Funcionário</span>`:`<span class="chip ${s.tipo==="Condicional"?"info":"warn"}">${s.tipo==="Condicional"?"Condicional":"Costureira"}</span>`}</td>
          <td><b>${esc(s.pessoa)}</b>${s.contato?`<div class="hint">${esc(s.contato)}</div>`:""}${s.obs?`<div class="hint">${esc(s.obs)}</div>`:""}</td>
          <td class="tnum">${fmtDate(s.data)}<div class="hint">${esc(s.user||"")}</div></td>
          <td class="tnum">${s.prev?fmtDate(s.prev):"—"}${ab&&s.prev?`<div class="hint" style="${atr?"color:var(--crit);font-weight:700":""}">${atr?`atrasada ${diasEntre(s.prev,hoje)} dia(s)`:s.prev===hoje?"vence hoje":`faltam ${diasEntre(hoje,s.prev)} dia(s)`}</div>`:""}</td>
          <td style="max-width:280px"><div class="hint" style="color:var(--fg)">${s.itens.map(it=>`${it.qtd>1?it.qtd+"× ":""}${esc(it.nome)} <span style="color:var(--muted)">(${esc(it.cor||"")}${it.cor&&it.tam?" · ":""}${esc(it.tam||"")})</span>`).join("<br>")}</div></td>
          <td>${ab?`<b>${resto}</b> de ${tot} fora`:`<span class="chip good">Concluída</span>`}${vend?`<div class="hint">${vend} vendida(s)</div>`:""}${!ab&&s.fechada?`<div class="hint">${esc(s.fechada)}</div>`:""}</td>
          <td style="text-align:right">${ab?`<button class="btn sm" data-ret="${s.id}">Dar retorno</button>`:""}</td></tr>`;}).join("")
        :`<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px">${SAIF==="abertas"?"Nenhuma peça fora da loja agora.":"Nenhuma saída registrada ainda."}</td></tr>`}</tbody>
    </table></div></div></div>

  $("#sai_nova").addEventListener("click",()=>modalNovaSaida());
  $("#sai_f").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;SAIF=b.dataset.f;viewSaidas();});
  $("#view").querySelectorAll("[data-ret]").forEach(b=>b.addEventListener("click",()=>modalRetornoSaida(SAIDAS.find(s=>s.id===+b.dataset.ret))));
}
function modalNovaSaida(){
  const itens=[]; // {p, qtd}
  const somaDias=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
  modal(`<h3>Nova saída de peças</h3>
    <div class="g g2">
      <div class="field"><label>Tipo <span class="req">*</span></label><select class="inp" id="sa_tipo"><option value="Condicional">Condicional (cliente leva para provar)</option><option value="Costureira">Costureira (ajuste)</option></select></div>
      <div class="field"><label>Previsão de retorno</label><input class="inp" id="sa_prev" type="date" value="${somaDias(2)}"></div>
    </div>
    <div class="g g2">
      <div class="field"><label id="sa_plbl">Cliente <span class="req">*</span></label><input class="inp" id="sa_pessoa" placeholder="Nome"></div>
      <div class="field"><label>Telefone</label><input class="inp" id="sa_contato" placeholder="(49) 9…" inputmode="tel"></div>
    </div>
    <div class="field"><label>Observação</label><input class="inp" id="sa_obs" placeholder="Ex.: fazer barra 2 cm / cliente volta sábado"></div>
    <div class="field"><label>Peças <span class="req">*</span></label>
      <div class="scanbar"><input class="inp" id="sa_code" autocomplete="off" placeholder="Bipe o código de barras (ou digite o código)"><button class="btn ghost" type="button" id="sa_add">Adicionar</button></div></div>
    <div id="sa_lista"></div>
    <div class="err" id="sa_err"></div>
    <div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="sa_ok">Registrar saída</button></div>`,"wide");
  const err=t=>{$("#sa_err").textContent=t;};
  $("#sa_tipo").addEventListener("change",e=>{ const c=e.target.value==="Condicional";
    $("#sa_plbl").innerHTML=(c?"Cliente":"Costureira")+' <span class="req">*</span>'; $("#sa_prev").value=somaDias(c?2:7); });
  const draw=()=>{
    $("#sa_lista").innerHTML=itens.length?`<div class="tw" style="border:1px solid var(--border);border-radius:10px"><table style="min-width:0"><tbody>
      ${itens.map((x,k)=>`<tr><td><b>${esc(x.p.nome)}</b><div class="hint">${esc(corCurta(x.p))} · Tam. ${esc(x.p.tam||"—")} · ${x.p.qtd} em estoque</div></td>
        <td class="num"><input class="inp" type="number" min="1" max="${x.p.qtd}" data-sq="${k}" value="${x.qtd}" style="width:64px"></td>
        <td><button class="icon-btn" style="width:28px;height:28px" data-srm="${k}" title="Remover">×</button></td></tr>`).join("")}</tbody></table></div>`
      :`<div class="infobox" style="text-align:center;color:var(--muted)">Nenhuma peça ainda. Bipe as peças que vão sair.</div>`;
    $("#sa_lista").querySelectorAll("[data-sq]").forEach(x=>x.addEventListener("change",()=>{const it=itens[+x.dataset.sq], q=Math.max(1,parseInt(x.value)||1);
      if(q>it.p.qtd){err(`Só há ${it.p.qtd} un. de ${it.p.nome} em estoque.`); it.qtd=it.p.qtd;} else it.qtd=q; draw();}));
    $("#sa_lista").querySelectorAll("[data-srm]").forEach(x=>x.addEventListener("click",()=>{itens.splice(+x.dataset.srm,1);draw();}));
  };
  const add=()=>{ const c=$("#sa_code").value.trim(); if(!c) return; $("#sa_code").value=""; err("");
    const p=acharProduto(c); if(!p) return err(`Código ${c} não cadastrado.`);
    const it=itens.find(x=>x.p===p), ja=it?it.qtd:0;
    if(ja+1>p.qtd) return err(`Sem estoque disponível de ${p.nome} (${corCurta(p)} · ${p.tam}).`);
    it?it.qtd++:itens.push({p,qtd:1}); draw(); $("#sa_code").focus(); };
  $("#sa_add").addEventListener("click",add);
  $("#sa_code").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}});
  draw(); setTimeout(()=>$("#sa_pessoa")?.focus(),50);
  $("#sa_ok").addEventListener("click",()=>{
    const tipo=$("#sa_tipo").value, pessoa=$("#sa_pessoa").value.trim();
    if(!pessoa) return err(tipo==="Condicional"?"Informe o nome do cliente.":"Informe o nome da costureira.");
    if(!itens.length) return err("Bipe pelo menos uma peça.");
    const falta=itens.find(x=>x.qtd>x.p.qtd); if(falta) return err(`Estoque insuficiente de ${falta.p.nome}.`);
    itens.forEach(x=>{ x.p.qtd-=x.qtd; x.p.fora=(x.p.fora||0)+x.qtd; });
    const s={id:SAIDAS.reduce((m,x)=>Math.max(m,x.id),0)+1,tipo,pessoa,contato:$("#sa_contato").value.trim(),obs:$("#sa_obs").value.trim(),
      data:hojeISO(),prev:$("#sa_prev").value||"",user:SESSION.name,
      itens:itens.map(x=>({sku:x.p.sku,nome:x.p.nome,cor:corCurta(x.p),tam:x.p.tam,qtd:x.qtd,ret:0,vend:0}))};
    SAIDAS.push(s); closeModal(); SAIF="abertas"; current="saidas"; renderNav(); route();
    toast(`${tipo==="Condicional"?"Condicional":"Saída para costureira"} registrada: ${s.itens.reduce((n,it)=>n+it.qtd,0)} peça(s) com ${pessoa}.`);
  });
}
function modalRetornoSaida(s){
  if(!s) return;
  // condicional e funcionário podem comprar; costureira só devolve
  const func=s.tipo==="Funcionário", cond=s.tipo==="Condicional"||func, pend=s.itens.map((it,k)=>({it,k,resto:saiResto(it)})).filter(x=>x.resto>0);
  modal(`<h3>Retorno — ${esc(s.pessoa)}</h3>
    <p style="margin:0;font-size:13px;color:var(--muted)">${s.tipo} desde ${fmtDate(s.data)}. Informe o que ${func?"voltou e o que o funcionário comprou":cond?"voltou e o que o cliente comprou":"voltou da costureira"}.${func?" A compra vai para a Nova venda como <b>desconto em folha</b> e precisa da senha do administrador.":cond?" O que for comprado vai para a Nova venda.":""}</p>
    <div class="tw" style="border:1px solid var(--border);border-radius:10px"><table style="min-width:0">
      <thead><tr><th>Peça</th><th class="num">Fora</th><th class="num">Voltou</th>${cond?'<th class="num">Comprou</th>':""}</tr></thead>
      <tbody>${pend.map(x=>`<tr><td><b>${esc(x.it.nome)}</b><div class="hint">${esc(x.it.cor||"")} · Tam. ${esc(x.it.tam||"—")}</div></td>
        <td class="num tnum">${x.resto}</td>
        <td class="num"><input class="inp" type="number" min="0" max="${x.resto}" data-rv="${x.k}" value="${cond?0:x.resto}" style="width:60px"></td>
        ${cond?`<td class="num"><input class="inp" type="number" min="0" max="${x.resto}" data-rc="${x.k}" value="0" style="width:60px"></td>`:""}</tr>`).join("")}</tbody></table></div>
    ${cond?`<div style="display:flex;gap:8px"><button class="btn ghost sm" type="button" id="rt_tudov">Tudo voltou</button><button class="btn ghost sm" type="button" id="rt_tudoc">Comprou tudo</button></div>`:""}
    <div class="err" id="rt_err"></div>
    <div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="rt_ok">Confirmar retorno</button></div>`,"wide");
  const val=(a,k)=>Math.max(0,parseInt($(`[data-${a}="${k}"]`)?.value)||0);
  $("#rt_tudov")?.addEventListener("click",()=>pend.forEach(x=>{$(`[data-rv="${x.k}"]`).value=x.resto;$(`[data-rc="${x.k}"]`).value=0;}));
  $("#rt_tudoc")?.addEventListener("click",()=>pend.forEach(x=>{$(`[data-rc="${x.k}"]`).value=x.resto;$(`[data-rv="${x.k}"]`).value=0;}));
  $("#rt_ok").addEventListener("click",()=>{
    const mov=pend.map(x=>({...x,v:val("rv",x.k),c:cond?val("rc",x.k):0}));
    const exc=mov.find(m=>m.v+m.c>m.resto); if(exc) return $("#rt_err").textContent=`${exc.it.nome}: voltou + comprou passa das ${exc.resto} peça(s) fora.`;
    if(!mov.some(m=>m.v||m.c)) return $("#rt_err").textContent="Informe pelo menos uma peça que voltou ou foi comprada.";
    if(func&&mov.some(m=>m.c)) return askAdminPw(()=>aplicar(mov),`Venda para funcionário (${esc(s.pessoa)}) com desconto em folha. Confirme com a senha do administrador.`);
    aplicar(mov);
  });
  function aplicar(mov){
    const vendidas=[];
    mov.forEach(m=>{ const n=m.v+m.c; if(!n) return;
      m.it.ret=(m.it.ret||0)+m.v; m.it.vend=(m.it.vend||0)+m.c;
      const p=ESTOQUE.find(x=>x.sku===m.it.sku);
      if(p){ p.qtd+=n; p.fora=Math.max(0,(p.fora||0)-n); if(m.c) vendidas.push({p,qtd:m.c}); } // comprado volta ao estoque e sai pela venda normal
    });
    if(!saiAberta(s)) s.fechada=`Concluída em ${agoraStr()}`;
    closeModal();
    if(vendidas.length){
      vendidas.forEach(({p,qtd})=>{const it=PDV.cart.find(i=>i.p===p); it?it.qtd+=qtd:PDV.cart.push({p,qtd,preco:p.preco});});
      PDV.ultima=null; if(func) PDV.pref={pay:PAG_FOLHA,func:s.pessoa}; // já abre com desconto em folha e o funcionário
      current="pdv"; renderNav(); route();
      toast(`Peças compradas por ${s.pessoa} foram para a Nova venda. Finalize a venda.`);
    } else { viewSaidas(); toast(`Retorno registrado (${s.pessoa}).`); }
  }
}

function modalCategorias(onClose){
  const fechar=()=>{closeModal(); (onClose||(()=>viewEstoque(false)))();};
  const draw=()=>{
    modal(`<h3>Categorias</h3>
      <div class="scanbar"><input class="inp" id="c_new" placeholder="Nova categoria (ex.: Bermudas)"><button class="btn" id="c_add">Criar</button></div>
      <div class="err" id="c_err" style="min-height:0"></div>
      <div class="tw" style="border:1px solid var(--border);border-radius:10px"><table style="min-width:0">
        <thead><tr><th>Categoria</th><th class="num">Produtos</th><th></th></tr></thead>
        <tbody>${CATEGORIAS.map((c,k)=>{const n=ESTOQUE.filter(p=>p.cat===c).length;return `<tr><td><b>${esc(c)}</b></td><td class="num tnum">${n}</td>
          <td class="num" style="white-space:nowrap"><button class="btn ghost sm" data-ren="${k}">Renomear</button>
          <button class="btn ghost sm" data-del="${k}" ${n?'disabled title="Tem produtos nesta categoria"':''}>Excluir</button></td></tr>`;}).join("")}</tbody></table></div>
      <div class="row"><button class="btn" data-close>Fechar</button></div>`,"wide");
    const err=t=>$("#c_err").textContent=t;
    const add=()=>{const v=$("#c_new").value.trim(); if(!v)return err("Digite o nome.");
      if(CATEGORIAS.some(c=>c.toLowerCase()===v.toLowerCase()))return err("Essa categoria já existe.");
      CATEGORIAS.push(v); draw(); toast(`Categoria ${v} criada.`);};
    $("#c_add").addEventListener("click",add);
    $("#c_new").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
    $("#modalHost").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{CATEGORIAS.splice(+b.dataset.del,1);draw();}));
    $("#modalHost").querySelectorAll("[data-ren]").forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.ren, old=CATEGORIAS[k], v=(prompt("Novo nome da categoria:",old)||"").trim();
      if(!v||v===old)return; if(CATEGORIAS.some(c=>c.toLowerCase()===v.toLowerCase()))return err("Essa categoria já existe.");
      CATEGORIAS[k]=v; ESTOQUE.forEach(p=>{if(p.cat===old)p.cat=v;}); draw();}));
    $("#modalHost").querySelector(".modal-bg").addEventListener("mousedown",e=>{if(e.target.classList.contains("modal-bg"))fechar();});
    $("#modalHost").querySelector("[data-close]").addEventListener("click",fechar);
    setTimeout(()=>$("#c_new")?.focus(),50);
  };
  draw();
}

const fmtMk=m=>m.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const parseNum=v=>parseFloat(String(v).replace(",","."));
function acharProduto(code){
  const c=String(code).trim(); if(!c)return null;
  return ESTOQUE.find(p=>p.ean===c)||ESTOQUE.find(p=>p.sku.toLowerCase()===c.toLowerCase())||null;
}
/* Consultar numeração: bipa a peça exposta e mostra todas as numerações do mesmo modelo (mesma descrição) */
const ordTam=(a,b)=>{const na=+a,nb=+b; if(!isNaN(na)&&!isNaN(nb))return na-nb;
  const ia=TAMANHOS.indexOf(a),ib=TAMANHOS.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib)||String(a).localeCompare(String(b));};
function modalConsulta(){
  modal(`<h3>Consultar numeração</h3>
    <p class="hint" style="margin:0 0 10px">Bipe o código de barras da peça exposta (ou digite o código / nome do modelo).</p>
    <div class="scanbar"><input class="inp" id="cq_in" autocomplete="off" placeholder="Bipe aqui…"><button class="btn" id="cq_ok">Consultar</button></div>
    <div id="cq_res" style="margin-top:14px"></div>
    <div class="row"><button class="btn ghost" data-close>Fechar</button></div>`,"wide");
  const inp=$("#cq_in");
  const mostra=()=>{
    const v=inp.value.trim(); if(!v) return;
    let p=acharProduto(v);
    if(!p){ const nomes=[...new Set(ESTOQUE.filter(x=>busca(x.nome,v)).map(x=>x.nome))];
      if(nomes.length===1) p=ESTOQUE.find(x=>x.nome===nomes[0]);
      else { $("#cq_res").innerHTML=`<div class="infobox" style="color:var(--crit)">${nomes.length?`Vários modelos com “${esc(v)}”: ${nomes.slice(0,6).map(esc).join(", ")}${nomes.length>6?"…":""}. Digite mais do nome.`:`Nenhum produto com o código “${esc(v)}”.`}</div>`; inp.select(); return; } }
    const chave=p.nome.trim().toLowerCase(), mod=ESTOQUE.filter(x=>x.nome.trim().toLowerCase()===chave);
    const tams=[...new Set(mod.map(x=>x.tam||"—"))].sort(ordTam);
    const cores=[...new Set(mod.map(x=>x.cor||"—"))].sort((a,b)=>(a===(p.cor||"—")?-1:b===(p.cor||"—")?1:a.localeCompare(b,"pt-BR")));
    const cel=(cor,t)=>{const it=mod.filter(x=>(x.cor||"—")===cor&&(x.tam||"—")===t); if(!it.length) return `<td class="num" style="color:var(--muted)">—</td>`;
      const q=it.reduce((s,x)=>s+x.qtd,0), cls=q===0?"crit":q<=Math.max(...it.map(x=>x.min||0))?"warn":"info";
      return `<td class="num"><span class="chip ${cls}" style="font-size:13px">${q}</span></td>`;};
    const tot=mod.reduce((s,x)=>s+x.qtd,0);
    $("#cq_res").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <div><b style="font-size:15px">${esc(p.nome)}</b><div class="hint">Bipado: ${esc(p.cor||"—")} · ${esc(p.tam||"—")} · ${brl(p.preco)}</div></div>
        <span class="hint">${tot} peça(s) no total</span></div>
      <div class="tw" style="border:1px solid var(--border);border-radius:10px"><table style="min-width:0">
        <thead><tr><th>Cor</th>${tams.map(t=>`<th class="num">${esc(t)}</th>`).join("")}</tr></thead>
        <tbody>${cores.map(c=>`<tr class="${c===(p.cor||"—")?"hl":""}"><td><b>${esc(c)}</b></td>${tams.map(t=>cel(c,t)).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="hint" style="margin-top:8px">Número = peças em estoque · <span style="color:var(--crit)">0 = esgotado</span> · — = numeração não cadastrada</div>`;
    inp.value=""; inp.focus();
  };
  $("#cq_ok").addEventListener("click",mostra);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();mostra();}});
  setTimeout(()=>inp.focus(),50);
}

// Cupons lidos de foto/vídeo, aguardando conferência (somem da lista depois de importados)

function lerXML(txt){
  const d=new DOMParser().parseFromString(txt,"text/xml");
  if(d.getElementsByTagName("parsererror").length) throw new Error("Arquivo não é um XML válido.");
  const g=(el,t)=>{const n=el&&el.getElementsByTagName(t)[0];return n?n.textContent.trim():"";};
  const cfe=d.getElementsByTagName("infCFe")[0], nfe=d.getElementsByTagName("infNFe")[0];
  if(!cfe&&!nfe) throw new Error("Não encontrei uma NF-e, NFC-e ou CF-e SAT neste XML.");
  const inf=cfe||nfe, emit=inf.getElementsByTagName("emit")[0], ide=inf.getElementsByTagName("ide")[0];
  let data=g(ide,"dhEmi")||g(ide,"dEmi");
  data=/^\d{8}$/.test(data)?`${data.slice(0,4)}-${data.slice(4,6)}-${data.slice(6,8)}`:data.slice(0,10);
  const mod=g(ide,"mod");
  const tipo=cfe?"CF-e SAT":mod==="65"?"NFC-e (cupom)":"NF-e";
  const itens=[...inf.getElementsByTagName("det")].map(det=>{
    const pr=det.getElementsByTagName("prod")[0];
    const q=parseFloat(g(pr,"qCom"))||0, vProd=parseFloat(g(pr,"vProd"))||0, vDesc=parseFloat(g(pr,"vDesc"))||0;
    let ean=g(pr,"cEAN"); if(!/^\d+$/.test(ean)) ean=g(pr,"cEANTrib");
    return impItem({ean,cProd:g(pr,"cProd"),nome:g(pr,"xProd"),q:Math.round(q)||q,custo:q?(vProd-vDesc)/q:parseFloat(g(pr,"vUnCom"))||0});
  });
  if(!itens.length) throw new Error("A nota não tem itens.");
  return {origem:"XML "+tipo,tipo,forn:g(emit,"xFant")||g(emit,"xNome")||"—",cnpj:g(emit,"CNPJ"),
    numero:g(ide,"nNF")||g(ide,"nCFe"),chave:(inf.getAttribute("Id")||"").replace(/^\D+/,""),data:data||hojeISO(),itens};
}

function invBipe(raw){

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function sugerirCodigo(cat){
  const pre=(cat||"PRD").normalize("NFD").replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase()||"PRD";
  // pula também códigos usados como base de grade (ex.: CAM-001-38, CAM-001-40…)
  const usado=c=>ESTOQUE.some(p=>p.sku===c||String(p.sku).startsWith(c+"-"));
  let n=1; while(usado(`${pre}-${String(n).padStart(3,"0")}`)) n++;
  return `${pre}-${String(n).padStart(3,"0")}`;
}
function hojeISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

      const {data,error}=await sb.rpc("estado_ler",{p_token:s.token}); // sem modal de "sessão encerrada" se o token não vale mais
      if(error) throw error;
      TOKEN=s.token; (data||[]).forEach(applyRow);
      const u=USERS.find(x=>x.id===s.user); if(!u||u.ativo===false) throw new Error("usuario");
      SESSION=u; expirou=false; ready=true; iniciar(); marcaUso(); startApp();
      status("✓ Conectado — alterações são salvas automaticamente","var(--good)");
    }catch(e){ TOKEN=null; ready=false; sessApagar(); status("✓ Conectado","var(--good)"); $("#pwHint").textContent="Sua sessão expirou. Entre de novo com sua senha."; }
  })();
})();

</script>
