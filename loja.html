<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COLAB Clothing — Loja</title>
<meta name="description" content="Peças da COLAB Clothing com estoque atualizado. Escolha, monte sua sacola e envie o pedido pelo WhatsApp.">
<meta name="theme-color" content="#0f0f0f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f4f2ee; --surface:#fff; --surface-2:#e9e6e0; --fg:#141414; --muted:#77736c; --border:#dedad3;
  --accent:#141414; --accent-ink:#f4f2ee; --ink:#0f0f0f; --prata:#c9c9c9; --good:#1f9d63; --crit:#d64545;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.08);
  --font-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* faixa de aviso + topo */
.anuncio{background:#1c1c1c;color:#d9d6d0;text-align:center;font-size:12px;font-weight:600;letter-spacing:.04em;padding:8px 12px}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#f4f2ee;border-bottom:1px solid #222;padding-top:env(safe-area-inset-top,0)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:96px}
/* logo ₡OLAB. (redesenhada em código): C cortado por duas linhas, letras finas e espaçadas, prata */
.logo{display:inline-flex;flex-direction:column;align-items:center;text-decoration:none;justify-self:center;line-height:1;color:#e9e9e9}
.logo .lw{display:flex;align-items:flex-end;font-family:"Montserrat",sans-serif;font-weight:700;font-size:48px;letter-spacing:.06em;
  color:#efefef;-webkit-text-fill-color:#efefef}
.logo .lc{position:relative;display:inline-block;font-size:1.32em;line-height:.8;margin-right:-.04em}
.logo .lc::before,.logo .lc::after{content:"";position:absolute;top:-14%;height:128%;width:.075em;min-width:2px;
  background:linear-gradient(180deg,#fff,#a8a8a8);transform:rotate(24deg);transform-origin:center;border-radius:1px}
.logo .lp{color:#e0242b;-webkit-text-fill-color:#e0242b;margin-left:.02em}
.logo .lc::before{left:43%}.logo .lc::after{left:57%}
.logo .lt{font-family:"Montserrat",sans-serif;font-weight:400;font-size:7.5px;letter-spacing:.5em;margin-top:10px;padding-left:.5em;color:#a9a6a0;white-space:nowrap}
.logo.esc .lw{color:#141414;-webkit-text-fill-color:#141414}
.logo.esc .lc::before,.logo.esc .lc::after{background:#1a1a1a}
.logo.esc .lt{color:var(--muted)}
.busca{position:relative;max-width:300px;width:100%}
.busca input{width:100%;height:40px;border-radius:2px;border:1px solid #333;background:#181818;color:#f4f2ee;padding:0 38px 0 12px;font-size:13px}
.busca input:focus{outline:none;border-color:#9c9c9c}
.busca input::placeholder{color:#8d8a85}
.busca svg{position:absolute;right:11px;top:11px;width:18px;height:18px;stroke:#c9c9c9}
.sacolaBtn{justify-self:end;position:relative;height:40px;border:0;background:none;color:#f4f2ee;font-weight:500;font-size:13px;display:flex;align-items:center;gap:7px;padding:0 4px;cursor:pointer}
.sacolaBtn svg{width:22px;height:22px;stroke:#f4f2ee}
.sacolaBtn b{font-weight:600}
.menu{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 26px;padding:0 16px 12px;max-width:1180px;margin:0 auto}
.menu button{border:0;background:none;padding:6px 0;font-size:12px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;color:#bdbab4;border-bottom:1px solid transparent}
.menu button:hover{color:#fff}
.menu button.on{color:#fff;border-bottom-color:#c9c9c9;font-weight:500}
@media (max-width:719px){
  .bar{grid-template-columns:1fr auto;grid-template-areas:"logo sac" "busca busca";height:auto;padding-top:10px;padding-bottom:10px;gap:10px}
  .logo{grid-area:logo;justify-self:start}.logo .lw{font-size:36px}.sacolaBtn{grid-area:sac}.busca{grid-area:busca;max-width:none}
  .sacolaBtn .txt{display:none}
  .menu{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:22px}
  .menu::-webkit-scrollbar{display:none}.menu button{flex:none}
}
.hero{padding:34px 0 4px;text-align:center}
.hero h1{font-family:var(--font-display);font-size:clamp(16px,2.2vw,20px);font-weight:400;margin:0;letter-spacing:.22em;text-transform:uppercase}
.hero p{margin:8px auto 0;color:var(--muted);max-width:640px;font-size:13px}
.hero .ig{display:inline-flex;gap:6px;align-items:center;margin-top:6px;color:var(--fg);font-weight:600;text-decoration:none;font-size:13px}
.filtros{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:18px 0 14px}
.filtros select{border:1px solid #cfcfcf;background:#fff;border-radius:2px;padding:8px 12px;font-size:12.5px;font-weight:500}
.conta{color:var(--muted);font-size:12.5px}

/* vitrine */
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;padding-bottom:48px}
@media (min-width:720px){.grade{grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 20px}}
@media (min-width:1040px){.grade{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:none;border:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:center;padding:0;color:var(--fg)}
.foto{aspect-ratio:3/4;background:var(--surface-2);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}
.foto img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s,transform .5s}
.foto img.carregou{opacity:1}
.card:hover .foto img.carregou{transform:scale(1.04)}
.foto .sem{font-weight:200;font-size:22px;letter-spacing:.2em;color:#c4c0b8}
.tag{position:absolute;left:10px;top:10px;background:var(--ink);color:#f4f2ee;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:2px;letter-spacing:.06em;text-transform:uppercase}
.card .info{padding:12px 4px 0;display:flex;flex-direction:column;gap:3px;align-items:center}
.card .nome{font-weight:500;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cor{color:var(--muted);font-size:11.5px}
.card .preco{font-weight:700;font-size:15px;margin-top:3px}
.card .tams{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:5px}
.card .tams span{font-size:10.5px;border:1px solid var(--border);padding:1px 6px;color:var(--muted)}
.card.esg{opacity:.55}
.vazio{text-align:center;color:var(--muted);padding:60px 16px}
.vazio b{display:block;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg);margin-bottom:6px}

/* página do produto */
.migalha{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:18px 0 14px}
.migalha a{text-decoration:none;cursor:pointer}.migalha a:hover{color:var(--fg)}
.pp{display:grid;gap:22px;padding-bottom:40px}
@media (min-width:860px){.pp{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px}}
.pgal{display:grid;gap:10px;min-width:0}
@media (min-width:720px){.pgal.multi{grid-template-columns:78px minmax(0,1fr)}}
.pinfo{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:860px){.pinfo{position:sticky;top:150px;align-self:start}}
.pinfo h1{font-size:20px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin:0;line-height:1.25}
.pinfo .pcor{color:var(--muted);font-size:13px;margin-top:4px}
.pinfo .pr{font-size:24px;font-weight:700}
.pinfo #pref{font-size:11.5px;color:var(--muted);margin-top:-12px}
.linha{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.linha>.lbl{min-width:44px}
.btn.comprar:hover:not(:disabled){background:#2c2c2c}
.btn.comprar{border-radius:2px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;padding:16px;font-size:14px}
.acc{border-top:1px solid var(--border)}
.acc details{border-bottom:1px solid var(--border)}
.acc summary{list-style:none;cursor:pointer;padding:15px 2px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
.acc details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.acc .accb{padding:0 2px 16px;font-size:13px;color:#444;white-space:pre-line}
.mais{padding:10px 0 40px}
.mais h2{text-align:center;font-size:15px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;margin:10px 0 22px}

/* painéis */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.veu{align-items:center;padding:24px}}
.painel{background:var(--surface);width:100%;max-width:880px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0)}
@media (min-width:720px){.painel{border-radius:20px}}
.painel.lado{max-width:460px}
@media (min-width:720px){.veu.dir{justify-content:flex-end;align-items:stretch;padding:0}.veu.dir .painel{border-radius:0;max-height:none;height:100%}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.ph h2{font-family:var(--font-display);font-size:18px;margin:0}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:18px;line-height:1}
.prod{display:grid;gap:0}
@media (min-width:720px){.prod{grid-template-columns:1.05fr 1fr}}
.prod .foto{aspect-ratio:1/1}
.prod .dados{padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}
.prod h3{font-family:var(--font-display);font-size:22px;margin:0;line-height:1.15}
.prod .pr{font-family:var(--font-display);font-weight:800;font-size:24px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tamsel{display:flex;flex-wrap:wrap;gap:8px}
.tamsel button{min-width:46px;height:42px;border-radius:2px;border:1px solid #cfcfcf;background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;padding:0 10px}
.tamsel button:hover:not(:disabled){border-color:var(--fg)}
.tamsel button.on{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.tamsel button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.cores{display:flex;flex-wrap:wrap;gap:6px}
.cores button{border:1px solid #cfcfcf;background:var(--surface);border-radius:2px;padding:8px 12px;font-size:12.5px;cursor:pointer}
.cores button.on{border-color:var(--fg);font-weight:700}
.qtd{display:inline-flex;align-items:center;border:1px solid #cfcfcf;border-radius:2px;overflow:hidden}
.qtd button{width:38px;height:38px;border:0;background:var(--surface-2);font-size:18px;cursor:pointer}
.qtd span{min-width:36px;text-align:center;font-weight:700}
.btn{border:0;border-radius:4px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.esc{background:var(--ink);color:#f4f2ee}
.btn.lin{background:transparent;color:var(--fg);border:1px solid var(--border)}
.btn.wa{background:#1f9d63}
.desc{color:var(--muted);font-size:14px;white-space:pre-line}
.itens{padding:6px 16px}
.it{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.it>div{min-width:0}
.it>div>div{flex-wrap:wrap}
.it .mini{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.it .mini img{width:100%;height:100%;object-fit:cover}
.it b{font-size:14px;display:block;line-height:1.2}
.it small{color:var(--muted)}
.it .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;margin-top:4px}
.it .aviso{color:var(--crit);font-size:12px;font-weight:600}
.form{padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg);font-size:15px}
.f input:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.opc{display:flex;gap:8px}
.opc label{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:14px}
.opc label small{font-weight:500;color:var(--muted);font-size:12px}
.opc input{display:none}
.opc label:has(input:checked){border-color:var(--fg);background:var(--surface-2)}
.g2f{display:grid;grid-template-columns:110px 1fr;gap:10px}
.g2f .f{min-width:0}
.tot{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.tot.g{font-size:18px;color:var(--fg);font-weight:800;font-family:var(--font-display)}
.err{color:var(--crit);font-size:13px;font-weight:600;min-height:1em}
.nota{font-size:12px;color:var(--muted);text-align:center}
.ok{padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.ok .bola{width:64px;height:64px;border-radius:999px;background:var(--good);color:#fff;display:grid;place-items:center;font-size:30px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
footer{background:var(--ink);color:#a9a6a0;padding:34px 0 calc(34px + env(safe-area-inset-bottom,0));font-size:12.5px;letter-spacing:.04em}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 20px;justify-content:space-between;align-items:center}
footer a{color:inherit}
/* galeria do produto */
.gal{position:relative;background:var(--surface-2);min-width:0}
.prod>*{min-width:0}
.galv{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:3/4}
.galv::-webkit-scrollbar{display:none}
.gi{flex:0 0 100%;scroll-snap-align:start;overflow:hidden;position:relative;cursor:zoom-in;display:grid;place-items:center}
.gi img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.gi img.carregou{opacity:1}
.gi.zoom img{transition:none}
.galt{display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none;max-height:min(780px,calc(100vh - 170px))}
.galt::-webkit-scrollbar{display:none}
.galt button{flex:none;width:78px;aspect-ratio:3/4;border-radius:0;overflow:hidden;border:1px solid transparent;padding:0;background:var(--surface-2);cursor:pointer;opacity:.55;transition:opacity .15s}
.galt button:hover{opacity:.9}
.galt button.on{border-color:var(--fg);opacity:1}
.galt img{width:100%;height:100%;object-fit:cover}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:9px;background:#fff;opacity:.55;box-shadow:0 0 2px #0008}
.dots i.on{opacity:1}
.zdica{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:2px;pointer-events:none}
@media (min-width:720px){.dots{display:none}}
@media (max-width:719px){.galt{display:none}}
/* zoom em tela cheia */
.lb{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;color:#fff;user-select:none;-webkit-user-select:none}
.lbst{flex:1;position:relative;overflow:hidden;touch-action:none;display:grid;place-items:center;cursor:zoom-in}
.lbst.z{cursor:grab}
.lbst img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-drag:none;pointer-events:none}
.lbtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0)) 12px 10px;z-index:2;background:linear-gradient(#000a,transparent)}
.lbtop .x{background:rgba(255,255,255,.15);color:#fff}
.lbseta{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
.lbseta.e{left:12px}.lbseta.d{right:12px}
.lbdica{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0));text-align:center;font-size:12px;opacity:.75;pointer-events:none}
@media (hover:none){.lbseta{display:none}}
.carreg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){.carreg{grid-template-columns:repeat(4,1fr)}}
.carreg div{aspect-ratio:3/4;border-radius:0;background:var(--surface-2);animation:pul 1.2s ease-in-out infinite alternate}
@keyframes pul{from{opacity:.55}to{opacity:1}}
</style>
</head>
<body>
<div id="fgbar" class="anuncio" hidden></div>
<header><div class="wrap bar">
  <div class="busca"><input id="q" type="search" placeholder="O que você está buscando?" autocomplete="off" aria-label="Buscar">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
  <a class="logo" href="#" id="logo" aria-label="COLAB — início"><span class="lw"><span class="lc">C</span>OLAB<span class="lp">.</span></span></a>
  <button class="sacolaBtn" id="abreSacola" aria-label="Abrir sacola"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 14H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="txt">Sacola</span> (<b id="nSacola">0</b>)</button>
</div><nav class="menu" id="menu" aria-label="Categorias"></nav></header>

<main class="wrap" id="inicio">
  <section class="hero"><h1 id="titulo">Todos os produtos</h1><p id="texto">Escolha o tamanho, monte sua sacola e envie o pedido pelo WhatsApp.</p><a class="ig" id="ig" hidden target="_blank" rel="noopener"></a></section>
  <div class="filtros"><div class="conta" id="conta"></div><div id="filtros"></div></div>
  <div id="vitrine"><div class="carreg"><div></div><div></div><div></div><div></div></div></div>
</main>
<main class="wrap" id="pagina" hidden></main>
<footer><div class="wrap"><span class="logo" style="justify-self:start;align-items:flex-start"><span class="lw" style="font-size:22px"><span class="lc">C</span>OLAB<span class="lp">.</span></span><span class="lt" style="padding-left:0">ESTILO · ATITUDE · PRESENÇA</span></span><span>Chapecó · SC</span><span id="rodape"></span></div></footer>
<div id="host"></div>

<script>
const SUPABASE_URL="https://xdomtxsohbxdicuxyjfy.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkb210eHNvaGJ4ZGljdXh5amZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODEyMDYsImV4cCI6MjEwNzc1NzIwNn0.Ut18MmTkt_H3u6fjxc1M0-wfNCgmN3rCaI1xNNGwSbQ";
const $=s=>document.querySelector(s);

async function buscaFotos(refs){

}

// galeria: deslizar entre as fotos, lupa ao passar o mouse, toque/clique abre o zoom em tela cheia
function galeria(fs){

  const marca=k=>{ document.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",j===k)); document.querySelectorAll("[data-gt]").forEach((b,j)=>b.classList.toggle("on",j===k)); };
  v.addEventListener("scroll",()=>marca(Math.round(v.scrollLeft/v.clientWidth)),{passive:true});
  document.querySelectorAll("[data-gt]").forEach(b=>b.onclick=()=>{ v.scrollTo({left:+b.dataset.gt*v.clientWidth,behavior:"smooth"}); marca(+b.dataset.gt); });
  const lupa=matchMedia("(hover:hover) and (pointer:fine)").matches;
  v.querySelectorAll(".gi").forEach(g=>{ const img=g.querySelector("img");
    if(lupa){
      g.addEventListener("mousemove",e=>{ const r=g.getBoundingClientRect(); g.classList.add("zoom");
        img.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`; img.style.transform="scale(2.4)"; });
      g.addEventListener("mouseleave",()=>{ g.classList.remove("zoom"); img.style.transform=""; });
    }
    g.addEventListener("click",()=>abreZoom(fs,+g.dataset.gi));
  });
}
function abreZoom(fs,ini){
  let i=ini, s=1, tx=0, ty=0, g0=null, arr=null, ultTap=0;
  const pts=new Map(), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const el=document.createElement("div"); el.className="lb";
  el.innerHTML=`<div class="lbtop"><span id="lbn" style="font-weight:700;font-size:14px"></span><button class="x" id="lbx" aria-label="Fechar">×</button></div>
    <div class="lbst" id="lbst"><img id="lbimg" alt=""></div>
    ${fs.length>1?`<button class="lbseta e" id="lbe" aria-label="Foto anterior">‹</button><button class="lbseta d" id="lbd" aria-label="Próxima foto">›</button>`:""}
    <div class="lbdica">${matchMedia("(hover:none)").matches?"Afaste dois dedos para aproximar · toque duas vezes para ampliar":"Clique para ampliar · role a rodinha do mouse · arraste para ver os detalhes"}</div>`;
  document.body.appendChild(el);
  const st=el.querySelector("#lbst"), img=el.querySelector("#lbimg");
  const aplica=anim=>{ img.style.transition=anim?"transform .22s ease":"none"; img.style.transform=`translate(${tx}px,${ty}px) scale(${s})`; st.classList.toggle("z",s>1); };
  const limita=()=>{ const r=st.getBoundingClientRect(), mx=(s-1)*r.width/2, my=(s-1)*r.height/2; tx=Math.max(-mx,Math.min(mx,tx)); ty=Math.max(-my,Math.min(my,ty)); };
  const zoomEm=(cx,cy,s2)=>{ s2=Math.max(1,Math.min(5,s2)); const r=st.getBoundingClientRect(), px=cx-r.left-r.width/2, py=cy-r.top-r.height/2;
    tx=px-(px-tx)*(s2/s); ty=py-(py-ty)*(s2/s); s=s2; if(s<=1.01){ s=1; tx=ty=0; } limita(); };
  const mostra=k=>{ i=(k+fs.length)%fs.length; s=1; tx=ty=0; aplica(); el.querySelector("#lbn").textContent=fs.length>1?`${i+1} / ${fs.length}`:"";
    const r=fs[i]; img.src=FOTOS[r]||""; if(!FOTOS[r]) buscaFotos([r]).then(()=>{ if(fs[i]===r) img.src=FOTOS[r]||""; }); };
  const fechaZ=()=>{ el.remove(); removeEventListener("keydown",tecla,true); };
  const tecla=e=>{ if(e.key==="Escape"){ e.stopImmediatePropagation(); fechaZ(); } else if(e.key==="ArrowRight") mostra(i+1); else if(e.key==="ArrowLeft") mostra(i-1); };
  addEventListener("keydown",tecla,true);
  el.querySelector("#lbx").onclick=fechaZ;
  if(fs.length>1){ el.querySelector("#lbe").onclick=()=>mostra(i-1); el.querySelector("#lbd").onclick=()=>mostra(i+1); }
  st.addEventListener("pointerdown",e=>{ try{ st.setPointerCapture(e.pointerId); }catch(x){} pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [a,b]=[...pts.values()]; g0={d:dist(a,b)||1,s,tx,ty,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}; arr=null; }
    else if(pts.size===1) arr={x:e.clientX,y:e.clientY,tx,ty,mov:false}; });
  st.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2&&g0){ const [a,b]=[...pts.values()]; s=g0.s; tx=g0.tx; ty=g0.ty; zoomEm(g0.cx,g0.cy,g0.s*dist(a,b)/g0.d); aplica(); return; }
    if(!arr) return; const dx=e.clientX-arr.x, dy=e.clientY-arr.y; if(Math.abs(dx)+Math.abs(dy)>6) arr.mov=true;
    if(s>1){ tx=arr.tx+dx; ty=arr.ty+dy; limita(); aplica(); }
    else if(fs.length>1){ img.style.transition="none"; img.style.transform=`translateX(${dx}px)`; } });
  const solta=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if(pts.size===1){ g0=null; const [p]=[...pts.values()]; arr={x:p.x,y:p.y,tx,ty,mov:true}; return; }
    if(pts.size||!arr){ g0=null; return; }
    const dx=e.clientX-arr.x;
    if(s===1&&arr.mov&&Math.abs(dx)>50&&fs.length>1) mostra(i+(dx<0?1:-1));
    else if(!arr.mov){ const ag=Date.now();
      if(e.pointerType==="mouse"||ag-ultTap<320){ zoomEm(e.clientX,e.clientY,s>1?1:2.6); aplica(true); ultTap=0; } else ultTap=ag; }
    else if(s===1) aplica(true);
    arr=null; g0=null; };
  st.addEventListener("pointerup",solta); st.addEventListener("pointercancel",solta);
  st.addEventListener("wheel",e=>{ e.preventDefault(); zoomEm(e.clientX,e.clientY,s*(e.deltaY<0?1.25:1/1.25)); aplica(); },{passive:false});
  mostra(ini);
}

/* ---------- sacola ---------- */
function salvaSacola(){ ls.set("colab_sacola",SACOLA); $("#nSacola").textContent=SACOLA.reduce((s,i)=>s+i.qtd,0); }
function linhas(){ return SACOLA.map(i=>{ const p=PRODS.find(x=>x.id===i.id), t=p&&p.tams.find(x=>x.t===i.tam);
  return {i,p,t,ok:!!(p&&t&&t.ok),preco:t?+t.preco||0:0}; }); }
// ajusta a sacola ao estoque atual; devolve true se precisou diminuir alguma peça
function ajustaSacola(){
  let mudou=false;
  SACOLA.forEach(i=>{ const p=PRODS.find(x=>x.id===i.id), t=p&&p.tams.find(x=>x.t===i.tam); if(!t||!t.ok) return;
    const lim=maxDe(t)-naSacola(i.id,i.tam,i); if(i.qtd>lim){ i.qtd=Math.max(0,lim); mudou=true; } });
  const antes=SACOLA.length; SACOLA=SACOLA.filter(i=>i.qtd>0); if(SACOLA.length!==antes) mudou=true;
  if(mudou) salvaSacola(); return mudou;
}
function abreSacola(aviso){
  if(ajustaSacola()&&!aviso) aviso="Algumas quantidades foram ajustadas ao estoque disponível.";
  const L=linhas(), validas=L.filter(l=>l.ok);
  const sub=validas.reduce((s,l)=>s+l.preco*l.i.qtd,0);
  const ret=LOJA.retirada!==false, ent=!!LOJA.entrega;
  let modo=CLI.modo&&((CLI.modo==="entregar"&&ent)||(CLI.modo==="retirar"&&ret))?CLI.modo:(ret?"retirar":"entregar");
  abrePainel(`<div class="ph"><h2>Sua sacola</h2><button class="x" data-fecha aria-label="Fechar">×</button></div>
    ${L.length?`<div class="itens">${L.map((l,k)=>`<div class="it">
        <div class="mini">${l.p&&l.p.foto?`<img data-f="${esc(l.p.foto)}" alt="">`:""}</div>
        <div><b>${esc(l.p?l.p.nome:"Peça indisponível")}</b><small>${esc(l.p?l.p.cor||"":"")} · Tam. ${esc(l.i.tam)}</small>
          ${l.ok?"":`<div class="aviso">Esgotou — será removida do pedido</div>`}
          <div style="display:flex;gap:10px;align-items:center;margin-top:6px"><div class="qtd"><button data-sq="${k}" data-d="-1" aria-label="Menos">−</button><span>${l.i.qtd}</span><button data-sq="${k}" data-d="1" aria-label="Mais">+</button></div>
          <button class="rm" data-rm="${k}">Remover</button></div></div>
        <div style="font-weight:800">${l.ok?brl(l.preco*l.i.qtd):"—"}</div></div>`).join("")}</div>
      <div class="form">
        <div class="lbl">Como você quer receber?</div>
        <div class="opc">${ret?`<label><input type="radio" name="modo" value="retirar" ${modo==="retirar"?"checked":""}>Retirar na loja<small>${esc(LOJA.endereco||"sem custo")}</small></label>`:""}
          ${ent?`<label><input type="radio" name="modo" value="entregar" ${modo==="entregar"?"checked":""}>Entrega<small>frete calculado pelo CEP${LOJA.entregaTxt?" · "+esc(LOJA.entregaTxt):""}${gratisTxt()?`<br><b style="color:var(--good)">${esc(gratisTxt())}</b>`:""}</small></label>`:""}</div>
        <div class="f"><label for="cn">Seu nome *</label><input id="cn" autocomplete="name" value="${esc(CLI.nome||"")}"></div>
        <div class="f"><label for="ct">WhatsApp com DDD *</label><input id="ct" inputmode="tel" autocomplete="tel" placeholder="(49) 9…" value="${esc(CLI.tel||"")}"></div>
        <div id="fend" ${modo==="entregar"?"":"hidden"} style="display:flex;flex-direction:column;gap:12px">
          <div class="f"><label for="cc">CEP *</label><input id="cc" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" maxlength="9" value="${esc(CLI.cep?fmtCep(CLI.cep):"")}">
            <small id="ccst" style="font-size:12px;color:var(--muted)">Digite o CEP e o endereço é preenchido sozinho. <a href="https://buscacepinter.correios.com.br/" target="_blank" rel="noopener" style="color:inherit">Não sei meu CEP</a></small></div>
          <div class="f"><label for="cr">Rua *</label><input id="cr" autocomplete="address-line1" value="${esc(CLI.rua||"")}"></div>
          <div class="g2f"><div class="f"><label for="cnum">Número *</label><input id="cnum" inputmode="numeric" value="${esc(CLI.num||"")}"></div>
            <div class="f"><label for="ccp">Complemento</label><input id="ccp" placeholder="Apto, bloco…" autocomplete="address-line2" value="${esc(CLI.comp||"")}"></div></div>
          <div class="f"><label for="cb">Bairro *</label><input id="cb" value="${esc(CLI.bairro||"")}"></div>
          <div class="g2f" style="grid-template-columns:1fr 92px"><div class="f"><label for="cci">Cidade *</label><input id="cci" autocomplete="address-level2" value="${esc(CLI.cidade||"")}"></div>
            <div class="f"><label for="cu">Estado *</label><select id="cu" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 8px;background:var(--bg);font-size:15px"><option value="">UF</option>${UFS.map(u=>`<option ${CLI.uf===u?"selected":""}>${u}</option>`).join("")}</select></div></div>
        </div>
        <div class="f"><label for="co">Observação</label><textarea id="co" rows="2" placeholder="Opcional"></textarea></div>
        <div class="tot"><span>Peças</span><span>${brl(sub)}</span></div>
        <div class="tot" id="ttx" ${modo==="entregar"?"":"hidden"}><span>Entrega</span><span id="tfr"></span></div>
        <div id="fgaviso" class="nota" style="text-align:left;font-weight:600"></div>
        <div class="tot g"><span>Total</span><span id="tg"></span></div>
        <div class="err" id="serr">${esc(aviso||"")}</div>
        <button class="btn wa" id="enviar" ${validas.length?"":"disabled"}>Enviar pedido pelo WhatsApp</button>
        <div class="nota">O pagamento (Pix, cartão ou link) é combinado com a loja pelo WhatsApp.</div>
      </div>`
    :`<div class="vazio"><b>Sacola vazia</b>Escolha uma peça e o tamanho para começar.<div style="margin-top:16px"><button class="btn esc" data-fecha data-vitrine style="width:auto">Ver peças</button></div></div>`}`,true);
  document.querySelectorAll("[data-sq]").forEach(b=>b.onclick=()=>{ const l=L[+b.dataset.sq], i=l.i, d=+b.dataset.d;
    if(d>0&&l.t&&i.qtd+naSacola(i.id,i.tam,i)>=maxDe(l.t)) return abreSacola(`Temos só ${maxDe(l.t)} peça(s) de ${l.p.nome} no tamanho ${i.tam}.`);
    i.qtd=Math.max(1,i.qtd+d); salvaSacola(); abreSacola(); });
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ SACOLA.splice(+b.dataset.rm,1); salvaSacola(); abreSacola(); });
  const conta=()=>{ if(!$("#tg")) return; const uf=$("#cu").value, f=frete(modo,uf,sub);
    $("#tfr").innerHTML=f.gratis?`<b style="color:var(--good)">Grátis</b>`:f.falta?"informe o CEP":brl(f.taxa);
    $("#tg").textContent=brl(sub+f.taxa); $("#fgaviso").innerHTML=modo==="entregar"?f.aviso:""; };
  document.querySelectorAll("input[name=modo]").forEach(r=>r.onchange=()=>{ modo=r.value; $("#fend").hidden=modo!=="entregar"; $("#ttx").hidden=modo!=="entregar"; conta(); });
  $("#cu")?.addEventListener("change",conta); conta();
  const cc=$("#cc"); if(cc){
    let ultimo="";
    const busca=async()=>{ const d=cc.value.replace(/\D/g,"").slice(0,8); cc.value=fmtCep(d);
      if(d.length<8||d===ultimo) return; ultimo=d;
      const stt=$("#ccst"); stt.style.color="var(--muted)"; stt.textContent="Buscando endereço…";
      const r=await buscaCep(d); if(cc.value.replace(/\D/g,"")!==d) return;
      if(!r){ stt.style.color="var(--crit)"; stt.textContent="CEP não encontrado. Confira o número ou preencha o endereço abaixo."; return; }
      if(r.logradouro) $("#cr").value=r.logradouro; if(r.bairro) $("#cb").value=r.bairro;
      $("#cci").value=r.localidade||""; $("#cu").value=r.uf||""; conta();
      stt.style.color="var(--good)"; stt.textContent=`✓ ${r.localidade}/${r.uf}`;
      ($("#cr").value?$("#cnum"):$("#cr")).focus(); };
    cc.addEventListener("input",busca);
    if(cc.value.replace(/\D/g,"").length===8&&!$("#cci").value) busca();
  }
  const env=$("#enviar"); if(env) env.onclick=()=>enviar(modo);
  observaFotos($("#host"));
}
// frete: grátis a partir do valor mínimo para os estados das regiões marcadas no app
const UFS=["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
// tabela de frete do app: até "ate" = fixo; acima = % das peças; a partir de "gratis" = grátis (0 = sem frete grátis)
const FR=()=>LOJA.frete||{regA:["Sul","Sudeste"],ufA:["PR","SC","RS","SP","RJ","MG","ES"],a:{ate:200,fixo:31.9,pct:13,gratis:450},b:{ate:200,fixo:39.9,pct:15,gratis:0}};
const juntaE=l=>l.join(", ").replace(/, ([^,]*)$/," e $1");
const gratisTxt=()=>{ if(!LOJA.entrega) return ""; const f=FR(), a=+f.a.gratis>0, b=+f.b.gratis>0;
  if(a&&b) return `Frete grátis acima de ${brl(f.a.gratis)} para ${juntaE(f.regA)} e acima de ${brl(f.b.gratis)} para as demais regiões`;
  if(a) return `Frete grátis acima de ${brl(f.a.gratis)} para ${juntaE(f.regA)}`;
  if(b) return `Frete grátis acima de ${brl(f.b.gratis)} fora de ${juntaE(f.regA)}`; return ""; };
function frete(modo,uf,sub){
  if(modo!=="entregar") return {taxa:0,gratis:false,aviso:""};
  if(!uf) return {taxa:0,gratis:false,falta:true,aviso:"Informe o CEP para calcular o frete."};
  const f=FR(), g=(f.ufA||[]).includes(uf)?f.a:f.b, gr=+g.gratis||0;
  if(gr>0&&sub>=gr) return {taxa:0,gratis:true,aviso:`<span style="color:var(--good)">🚚 Você ganhou frete grátis!</span>`};
  const taxa=+(sub<=+g.ate?+g.fixo:sub*(+g.pct||0)/100).toFixed(2);
  return {taxa,gratis:false,aviso:gr>0?`🚚 Faltam <b>${brl(gr-sub)}</b> para ganhar frete grátis.`:""};
}
const fmtCep=d=>{ d=String(d||"").replace(/\D/g,"").slice(0,8); return d.length>5?d.slice(0,5)+"-"+d.slice(5):d; };
// endereço pelo CEP (ViaCEP, serviço público e gratuito)
const CEPS={};
async function buscaCep(d){
  if(d in CEPS) return CEPS[d];
  try{ const r=await fetch(`https://viacep.com.br/ws/${d}/json/`); const j=await r.json(); CEPS[d]=j&&!j.erro?j:null; }catch(e){ return null; }
  return CEPS[d];
}
async function enviar(modo){
  const v=id=>(($("#"+id)||{}).value||"").trim();
  const nome=v("cn"), tel=telNum(v("ct")), obs=v("co"), uf=v("cu"), cep=v("cc").replace(/\D/g,"");
  const ender={cep,rua:v("cr"),num:v("cnum"),comp:v("ccp"),bairro:v("cb"),cidade:v("cci"),uf};
  const end=modo==="entregar"?`${ender.rua}, ${ender.num}${ender.comp?` — ${ender.comp}`:""} — ${ender.bairro}, ${ender.cidade}/${uf} — CEP ${fmtCep(cep)}`:"";
  const err=(t,foco)=>{ $("#serr").textContent=t; if(foco) $("#"+foco)?.focus(); };
  if(!nome) return err("Informe seu nome.","cn");
  if(!telOk(tel)) return err("Informe seu WhatsApp com DDD.","ct");
  if(modo==="entregar"){
    if(cep.length!==8) return err("Informe o CEP da entrega.","cc");
    if(!ender.rua) return err("Informe a rua.","cr");
    if(!ender.num) return err("Informe o número (ou S/N).","cnum");
    if(!ender.bairro) return err("Informe o bairro.","cb");
    if(!ender.cidade) return err("Informe a cidade.","cci");
    if(!uf) return err("Escolha o estado.","cu");
  }
  if(!LOJA.whats) return err("A loja ainda não configurou o WhatsApp. Tente mais tarde.");
  const b=$("#enviar"); b.disabled=true; b.textContent="Conferindo estoque…";
  try{ await carregar(); }catch(e){}
  let L=linhas(), ok=L.filter(l=>l.ok);
  if(ok.length!==L.length){ SACOLA=ok.map(l=>l.i); salvaSacola(); render(); abreSacola("Algumas peças esgotaram e saíram da sacola. Confira e envie de novo."); return; }
  if(ajustaSacola()){ render(); abreSacola("O estoque mudou e algumas quantidades foram ajustadas. Confira e envie de novo."); return; }
  L=linhas(); ok=L.filter(l=>l.ok);
  CLI={nome,tel,modo,...(modo==="entregar"?ender:{uf:CLI.uf,cep:CLI.cep,rua:CLI.rua,num:CLI.num,comp:CLI.comp,bairro:CLI.bairro,cidade:CLI.cidade})}; ls.set("colab_cliente",CLI);
  const sub=ok.reduce((s,l)=>s+l.preco*l.i.qtd,0), fr=frete(modo,uf,sub), taxa=fr.taxa;
  const itens=ok.map(l=>({id:l.p.id,sku:l.t.sku,ean:l.t.ean||"",foto:fotosP(l.p)[0]||"",nome:l.p.nome,cor:l.p.cor,tam:l.i.tam,qtd:l.i.qtd,preco:l.preco}));
  const dados={nome,tel,entrega:modo,endereco:end,uf:modo==="entregar"?uf:"",cep:modo==="entregar"?cep:"",freteGratis:fr.gratis,obs,itens,subtotal:+sub.toFixed(2),taxa,total:+(sub+taxa).toFixed(2)};
  let num=null;
  let semEstoque="";
  try{ const {data,error}=await sb.rpc("loja_pedido_criar",{p_dados:dados}); if(!error) num=data; else if(/sem_estoque/.test(error.message||"")) semEstoque=String(error.message).replace(/^.*sem_estoque:?\s*/,""); }catch(e){}
  // alguém pediu a mesma peça segundos antes: a loja reservou para essa pessoa
  if(semEstoque){
    try{ await carregar(); }catch(e){}
    const L2=linhas(); SACOLA=L2.filter(l=>l.ok).map(l=>l.i); ajustaSacola(); salvaSacola(); render();
    abreSacola(`Acabou de ser reservada para outro cliente: ${semEstoque}. Ajustamos a sua sacola — confira e envie de novo.`); return;
  }
  const msg=[`Olá! Quero fazer um pedido${num?` (#${num})`:""}:`,"",
    ...itens.map(i=>`• ${i.qtd}× ${i.nome} ${i.cor||""} — Tam. ${i.tam} — ${brl(i.preco*i.qtd)}\n   Ref. ${i.sku}${i.ean?` · Cód. barras ${i.ean}`:""}`),"",
    `Peças: ${brl(sub)}`,
    modo==="entregar"?`Frete: ${fr.gratis?"GRÁTIS":brl(taxa)}\n${end}`:"Retirar na loja",
    `*Total: ${brl(sub+taxa)}*`,"",`Nome: ${nome}`,obs?`Obs.: ${obs}`:""].filter(x=>x!==null).join("\n").replace(/\n{3,}/g,"\n\n").trim();
  const url=`https://wa.me/55${LOJA.whats}?text=${encodeURIComponent(msg)}`;
  SACOLA=[]; salvaSacola();
  abrePainel(`<div class="ph"><h2>Pedido pronto</h2><button class="x" data-fecha aria-label="Fechar">×</button></div>
    <div class="ok"><div class="bola">✓</div><b style="font-family:var(--font-display);font-size:20px">${num?`Pedido #${num}`:"Pedido montado"}</b>
      <div style="color:var(--muted)">Agora é só enviar a mensagem no WhatsApp para a loja confirmar e combinar o pagamento.</div>
      <a class="btn wa" style="text-decoration:none;text-align:center" href="${esc(url)}" target="_blank" rel="noopener">Abrir WhatsApp</a>
      <button class="btn lin" data-fecha>Continuar vendo peças</button></div>`,true);
  try{ const w=window.open(url,"_blank"); if(!w) location.href=url; }catch(e){ location.href=url; }
}

/* ---------- início ---------- */
$("#q").addEventListener("input",e=>{ F.q=e.target.value; if(!$("#pagina").hidden) irInicio(); render(); });
$("#logo").addEventListener("click",e=>{ e.preventDefault(); F.cat=""; F.q=""; $("#q").value=""; irInicio(); render(); scrollTo({top:0}); });
const rota=()=>{ const m=/^#p=(.+)$/.exec(location.hash); if(m&&PRODS.some(p=>p.id===decodeURIComponent(m[1]))) abreProduto(decodeURIComponent(m[1]),"",true); else mostraVitrine(); };
addEventListener("popstate",rota);
$("#abreSacola").addEventListener("click",()=>abreSacola());
salvaSacola();
(async()=>{
  if(!window.supabase){ $("#vitrine").innerHTML=`<div class="vazio"><b>Sem conexão</b>Verifique a internet e recarregue a página.</div>`; return; }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  try{ await carregar(); }catch(e){ $("#vitrine").innerHTML=`<div class="vazio"><b>Loja em preparação</b>Volte daqui a pouco.</div>`; return; }
  if(LOJA.texto) $("#texto").textContent=LOJA.texto;
  if(gratisTxt()){ $("#fgbar").hidden=false; $("#fgbar").textContent="🚚 "+gratisTxt(); }
  if(LOJA.insta){ const a=$("#ig"); a.hidden=false; a.href=`https://instagram.com/${encodeURIComponent(LOJA.insta)}`; a.textContent="@"+LOJA.insta; }
  $("#rodape").innerHTML=[LOJA.endereco?esc(LOJA.endereco):"",LOJA.whats?`<a href="https://wa.me/55${esc(LOJA.whats)}" target="_blank" rel="noopener">WhatsApp</a>`:""].filter(Boolean).join(" · ");
  SACOLA=SACOLA.filter(i=>PRODS.some(p=>p.id===i.id)); salvaSacola();
  render(); rota();
  setInterval(async()=>{ if($("#host").innerHTML||!$("#pagina").hidden) return; try{ await carregar(); render(); }catch(e){} },60000);
})();
</script>
</body></html>
